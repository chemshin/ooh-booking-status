<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 OOH 재원 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #f4f5f8;
  --bg2: #ffffff;
  --bg3: #eef0f4;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #111318;
  --text2: #5a6075;
  --text3: #9aa0b8;
  --accent: #3a6af8;
  --ok: #0c9060;
  --ok-bg: rgba(12,144,96,0.08);
  --warn: #b87200;
  --warn-bg: rgba(184,114,0,0.09);
  --danger: #d63c3c;
  --danger-bg: rgba(214,60,60,0.08);
  --radius: 14px;
  --font: 'Noto Sans KR', sans-serif;
  --mono: 'DM Mono', monospace;
  --panel-width: 480px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1.5rem 4rem;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 1rem;
}
.header-left { display: flex; flex-direction: column; gap: 4px; }
.header-eyebrow {
  font-size: 11px; font-weight: 500;
  letter-spacing: .12em; color: var(--accent);
  text-transform: uppercase; font-family: var(--mono);
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.week-badge {
  font-family: var(--mono); font-size: 11px;
  color: var(--text2); background: var(--bg3);
  border: 1px solid var(--border2);
  padding: 5px 12px; border-radius: 20px;
}

/* ── Month Tabs ── */
.month-tabs {
  display: flex; gap: 6px; margin-bottom: 1.75rem;
  overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin;
}
.month-tabs::-webkit-scrollbar { height: 4px; }
.month-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
.month-tab { flex-shrink: 0; }
.month-tab {
  padding: 7px 18px; font-size: 13px;
  font-family: var(--font); font-weight: 500;
  border: 1px solid var(--border2); border-radius: 24px;
  cursor: pointer; color: var(--text2); background: transparent;
  transition: all .2s ease; letter-spacing: -.01em;
}
.month-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
.month-tab.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent); box-shadow: 0 0 16px rgba(79,124,255,0.35);
}

/* ── Alerts ── */
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
.alert-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px; border: 1px solid;
  animation: fadeIn .3s ease;
}
.alert-high { background: var(--danger-bg); border-color: rgba(255,87,87,0.3); color: #ff8a8a; }
.alert-mid  { background: var(--warn-bg);   border-color: rgba(240,165,0,0.3);  color: #f0c060; }
.alert-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.alert-high .alert-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.alert-mid  .alert-dot { background: var(--warn);   box-shadow: 0 0 6px var(--warn); }
.alert-text { font-size: 12.5px; font-weight: 500; }



/* ── Section ── */
.section-block { margin-bottom: 2.5rem; }
.section-header {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 1rem; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-num {
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  color: var(--accent); letter-spacing: .08em;
  background: rgba(58,106,248,0.08);
  padding: 3px 8px; border-radius: 6px;
}
.section-title-large {
  font-size: 17px; font-weight: 700; letter-spacing: -.02em;
  color: var(--text);
}
.section-desc {
  font-size: 12px; color: var(--text3); margin-left: auto;
}
.section-title {
  font-size: 11px; font-weight: 500; letter-spacing: .1em;
  color: var(--text3); text-transform: uppercase; margin-bottom: 1rem;
}

/* ── Townboard Grid ── */
.townboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 16px;
}
.tb-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem;
  cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.tb-card:hover {
  transform: translateY(-3px); border-color: var(--border2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
}
.tb-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.tb-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.tb-month-pill {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  background: var(--bg3); color: var(--text2);
  font-family: var(--mono);
}
.tb-summary {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 14px;
}
.tb-stat {
  background: var(--bg3); border-radius: 10px; padding: 10px 12px;
  text-align: center;
}
.tb-stat-label {
  font-size: 10px; color: var(--text3);
  letter-spacing: .04em; margin-bottom: 4px;
}
.tb-stat-val {
  font-size: 18px; font-weight: 700; font-family: var(--mono);
  letter-spacing: -.02em;
}
.tb-stat-val.accent { color: var(--accent); }
.tb-stat-val.ok     { color: var(--ok); }
.tb-stat-val.warn   { color: var(--warn); }

/* 패키지 표 (전국F/A/B, 수도권F/A/B) */
.tb-pkg-table {
  width: 100%; font-size: 11.5px;
  border-collapse: collapse;
}
.tb-pkg-table th {
  font-size: 10px; color: var(--text3); font-weight: 500;
  text-align: left; padding: 6px 8px;
  letter-spacing: .04em; text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.tb-pkg-table th:not(:first-child) { text-align: right; }
.tb-pkg-table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
}
.tb-pkg-table td:first-child { font-family: var(--font); color: var(--text2); }
.tb-pkg-table td:not(:first-child) { text-align: right; }
.tb-pkg-table tr.tb-total td {
  font-weight: 700; color: var(--text); border-top: 1px solid var(--border2);
  border-bottom: none;
}

/* A/B 그룹 표시 */
.tb-groups {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.tb-group {
  background: var(--bg3); border-radius: 10px; padding: 10px 12px;
  text-align: center;
}
.tb-group-name { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.tb-group-pct {
  font-size: 16px; font-weight: 700; font-family: var(--mono);
}
.tb-group-pct.over { color: var(--accent); }
.tb-group-detail {
  font-size: 10px; color: var(--text3); margin-top: 3px; font-family: var(--mono);
}

/* ── Card Grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.media-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem 1rem 1rem;
  display: flex; flex-direction: column; align-items: center;
  position: relative; cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  animation: fadeIn .4s ease;
}
.media-card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.media-card.status-excellent { border-color: rgba(58,106,248,0.30); }
.media-card.status-good      { border-color: rgba(14,144,96,0.25); }
.media-card.status-normal    { border-color: rgba(150,150,150,0.20); }
.media-card.status-bad       { border-color: rgba(240,165,0,0.35); }
.media-card.status-critical  { border-color: rgba(214,60,60,0.40); }
.media-card.status-excellent:hover { border-color: rgba(58,106,248,0.55); box-shadow: 0 8px 32px rgba(58,106,248,0.10); }
.media-card.status-good:hover      { border-color: rgba(14,144,96,0.5);   box-shadow: 0 8px 32px rgba(14,144,96,0.10); }
.media-card.status-normal:hover    { border-color: rgba(150,150,150,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
.media-card.status-bad:hover       { border-color: rgba(240,165,0,0.6);   box-shadow: 0 8px 32px rgba(240,165,0,0.12); }
.media-card.status-critical:hover  { border-color: rgba(214,60,60,0.65);  box-shadow: 0 8px 32px rgba(214,60,60,0.13); }

.click-hint {
  position: absolute; bottom: 10px; right: 12px;
  font-size: 10px; color: var(--text3); font-family: var(--mono);
  opacity: 0; transition: opacity .2s;
}
.media-card:hover .click-hint { opacity: 1; }

.status-badge {
  position: absolute; top: 11px; right: 11px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 10px; letter-spacing: .04em; font-family: var(--mono);
}
.badge-excellent { background: rgba(58,106,248,0.10); color: #3a6af8; border: 1px solid rgba(58,106,248,0.3); }
.badge-good      { background: var(--ok-bg);             color: var(--ok);  border: 1px solid rgba(14,144,96,0.25); }
.badge-normal    { background: rgba(150,150,150,0.10);   color: #777;       border: 1px solid rgba(150,150,150,0.25); }
.badge-bad       { background: var(--warn-bg);           color: var(--warn);border: 1px solid rgba(240,165,0,0.3); }
.badge-critical  { background: var(--danger-bg);         color: var(--danger); border: 1px solid rgba(214,60,60,0.3); }

.media-name { font-size: 13px; font-weight: 700; margin-bottom: 14px; text-align: center; letter-spacing: -.01em; padding-right: 40px; width: 100%; }

.donut-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 14px; flex-shrink: 0; }
.donut-wrap canvas { position: absolute; top: 0; left: 0; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-pct { font-size: 20px; font-weight: 700; font-family: var(--mono); line-height: 1.1; letter-spacing: -.02em; }
.donut-label { font-size: 9px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.donut-total { font-size: 9px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

.legend { display: flex; flex-direction: column; gap: 6px; width: 100%; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
.legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; }
.legend-left { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.legend-key { color: var(--text2); }
.legend-val { font-weight: 500; font-family: var(--mono); font-size: 11px; }

/* ── Overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0); z-index: 100;
  pointer-events: none; transition: background .3s ease;
}
.overlay.open { background: rgba(0,0,0,0.55); pointer-events: all; }

/* ── Slide Panel ── */
.slide-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: var(--panel-width); max-width: 100vw;
  background: #ffffff;
  border-left: 1px solid var(--border2);
  z-index: 101;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.slide-panel.open { transform: translateX(0); }

.panel-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  flex-shrink: 0;
}
.panel-title-wrap { display: flex; flex-direction: column; gap: 4px; }
.panel-eyebrow { font-size: 11px; color: var(--text3); letter-spacing: .08em; font-family: var(--mono); text-transform: uppercase; }
.panel-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.panel-close {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; margin-top: 2px;
}
.panel-close:hover { background: var(--border2); color: var(--text); }

/* Panel month tabs */
.panel-month-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.panel-month-tabs::-webkit-scrollbar { height: 3px; }
.panel-month-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
.panel-tab {
  flex-shrink: 0; min-width: 70px;
  padding: 10px 12px; font-size: 12px; font-weight: 500;
  text-align: center; cursor: pointer; color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: all .15s; background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.panel-tab:hover { color: var(--text2); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panel summary chips */
.panel-summary {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
  padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.p-chip { background: var(--bg3); border-radius: 8px; padding: 8px 10px; text-align: center; }
.p-chip-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
.p-chip-val { font-size: 15px; font-weight: 700; font-family: var(--mono); }
.p-chip-val.ok { color: var(--ok); }
.p-chip-val.warn { color: var(--warn); }
.p-chip-val.danger { color: var(--danger); }
.p-chip-val.excellent { color: #3a6af8; }
.p-chip-val.good { color: var(--ok); }
.p-chip-val.normal { color: #777; }
.p-chip-val.bad { color: var(--warn); }
.p-chip-val.critical { color: var(--danger); }

/* Panel advertiser list */
.panel-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 2rem; }
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.adv-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text3);
  margin: 1rem 0 6px; display: flex; align-items: center; gap: 8px;
}
.adv-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.adv-row {
  display: grid;
  grid-template-columns: 1fr 56px 40px 70px;
  gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 8px;
  margin-bottom: 4px; transition: background .15s;
  animation: fadeIn .25s ease;
}
.adv-row:hover { background: var(--bg3); }
.adv-row.header-row {
  font-size: 10px; color: var(--text3); font-weight: 500;
  letter-spacing: .04em; padding: 4px 10px; margin-bottom: 2px;
  pointer-events: none;
}
.adv-name { font-size: 13px; font-weight: 500; color: var(--text); }
.adv-runtime { font-size: 11px; color: var(--text2); font-family: var(--mono); text-align: center; }
.adv-slot { font-size: 12px; font-weight: 700; font-family: var(--mono); text-align: center; }
.adv-period { font-size: 10px; color: var(--text3); font-family: var(--mono); text-align: right; }
.type-badge {
  display: inline-block; font-size: 9px; padding: 2px 5px;
  border-radius: 4px; font-weight: 700; margin-right: 4px; vertical-align: middle;
  font-family: var(--mono); letter-spacing: .03em;
}
.type-normal  { background: rgba(79,124,255,0.15); color: #7fa8ff; }
.type-service { background: rgba(34,201,138,0.12); color: #22c98a; }

.empty-state {
  text-align: center; padding: 3rem 1rem;
  color: var(--text3); font-size: 13px;
}

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Loading Spinner ── */
.spinner {
  width: 32px; height: 32px; margin: 0 auto;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 768px) {
  .section-header { flex-wrap: wrap; }
  .section-desc { width: 100%; margin-left: 0; margin-top: 4px; font-size: 11px; }
  .townboard-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { padding: 1.25rem 1rem 3rem; }
  .summary-row { grid-template-columns: repeat(2,1fr); }
  .card-grid { grid-template-columns: repeat(2,1fr); }
  header h1 { font-size: 18px; }
  :root { --panel-width: 100vw; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-eyebrow">JoongAng BizSolutions</span>
    <h1>2026 OOH 재원 현황</h1>
  </div>
  <span class="week-badge">4월 3주차 기준</span>
</header>

<div class="month-tabs" id="monthTabs"></div>
<div class="alerts" id="alerts"></div>

<div class="section-block">
  <div class="section-header">
    <span class="section-num">01</span>
    <h2 class="section-title-large">OOH</h2>
    <span class="section-desc">매체별 부킹 현황 — 클릭하면 광고주 리스트를 볼 수 있어요</span>
  </div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="section-block">
  <div class="section-header">
    <span class="section-num">02</span>
    <h2 class="section-title-large">타운보드</h2>
    <span class="section-desc">패키지 송출 현황 — 카드 클릭 시 광고주 리스트 확인</span>
  </div>
  <div class="townboard-grid" id="townboardGrid"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Slide Panel -->
<div class="slide-panel" id="slidePanel">
  <div class="panel-header">
    <div class="panel-title-wrap">
      <span class="panel-eyebrow" id="panelEyebrow">광고주 현황</span>
      <span class="panel-title" id="panelTitle">-</span>
    </div>
    <button class="panel-close" onclick="closePanel()">&#x2715;</button>
  </div>
  <div class="panel-month-tabs" id="panelMonthTabs"></div>
  <div class="panel-summary" id="panelSummary"></div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbywK5-EdcgUj145iceL_oasHiFkLZR1GczJYnk_XkEBYVX4Qbyxias1-FQIdG-OvxoGcQ/exec";

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let SUMMARY = {};
let ADVERTISERS = {};
let MONTHS = [];
let activeMonth = "";
let panelMedia = null;
let panelMonth = "";
const chartInstances = {};

/* ═══════════════════════════════════════════
   FETCH DATA
═══════════════════════════════════════════ */
function showLoading() {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)">
      <div class="spinner"></div>
      <p style="margin-top:1rem;font-size:13px">시트에서 데이터를 불러오는 중...</p>
    </div>`;
}

function showError(msg) {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--danger)">
      <p style="font-size:13px">⚠ 데이터를 불러오지 못했어요</p>
      <p style="font-size:11px;margin-top:6px;color:var(--text3)">${msg}</p>
    </div>`;
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch(GAS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    SUMMARY     = json.summary     || {};
    ADVERTISERS = json.advertisers || {};
    MONTHS      = Object.keys(SUMMARY);
    // 현재 월을 기본 활성으로 (없으면 첫 월)
    const now = new Date();
    const curKey = `26년 ${now.getMonth() + 1}월`;
    activeMonth = MONTHS.includes(curKey) ? curKey : (MONTHS[0] || "");
    panelMonth  = activeMonth;

    // 주차 라벨 업데이트
    const badge = document.querySelector('.week-badge');
    if (json.weekLabel) {
      badge.textContent = json.weekLabel;
    } else {
      // weekLabel 없으면 summary 마지막 키에서 추출
      const months = Object.keys(json.summary || {});
      if (months.length) badge.textContent = months[months.length - 1] + ' 기준';
    }

    render();
  } catch (e) {
    showError(e.message);
    console.error(e);
  }
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
// 시점(monthsAhead: 0=이번달, 1=다음달, 2=다다음달...) + 부킹률 → 5단계 상태
// 매체를 파는 입장: 잔여가 많으면 → 나쁨. 시점이 가까울수록 더 가혹하게.
function getStatus(pct, monthsAhead) {
  if (pct === null || pct === undefined) return 'neutral';
  // 임박/마감은 시점 무관하게 양호
  if (pct >= 95) return 'excellent';   // 매우 양호 (마감 임박~마감)
  if (pct >= 75) return 'good';        // 양호

  // 시점별 차등 기준
  if (monthsAhead === 0) {
    // 이번 달: 가혹하게
    if (pct >= 50) return 'normal';
    if (pct >= 30) return 'bad';
    return 'critical';                  // 매우 나쁨
  } else if (monthsAhead === 1) {
    // 다음 달
    if (pct >= 40) return 'normal';
    if (pct >= 20) return 'bad';
    return 'critical';
  } else {
    // 2달 이후
    if (pct >= 25) return 'normal';
    if (pct >= 10) return 'bad';
    return 'critical';
  }
}

// 현재 활성 월과 데이터 월의 차이 계산
// activeMonth: "26년 4월", currentMonth: "26년 4월" 형태
function getMonthsAhead(targetMonth) {
  // 현재 시스템 시간 기준
  const now = new Date();
  const curYr = now.getFullYear() % 100;
  const curMo = now.getMonth() + 1;

  const m = targetMonth.match(/(\d{2})년\s*(\d{1,2})월/);
  if (!m) return 0;
  const tYr = parseInt(m[1]);
  const tMo = parseInt(m[2]);

  return (tYr - curYr) * 12 + (tMo - curMo);
}
function getColors(pct) {
  // 유가: 파랑 계열 (좋은 것), 서비스: 주황 계열 (중립/경고), 잔여: 회색
  return { paid:'#3a6af8', svc:'#f0a500', remain:'#e4e7ef' };
}

   RENDER — Main Dashboard
═══════════════════════════════════════════ */
function renderMonthTabs() {
  const tabsEl = document.getElementById('monthTabs');
  tabsEl.innerHTML = MONTHS.map(m =>
    `<button class="month-tab${m===activeMonth?' active':''}" onclick="setMonth('${m}')">${m}</button>`
  ).join('');
  // 활성 탭이 화면에 보이도록 스크롤
  requestAnimationFrame(() => {
    const active = tabsEl.querySelector('.month-tab.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'auto', block: 'nearest' });
  });
}

function renderAlerts(data) {

  // 시점 기반 5단계 평가 → critical/bad만 알람으로 노출
  // (매체를 파는 입장: 잔여가 많으면 위험. 시점이 가까울수록 더 가혹)
  const monthsAhead = getMonthsAhead(activeMonth);
  const withStatus = data.map(d => ({ ...d, st: getStatus(d.bookPct, monthsAhead) }));

  const critical = withStatus.filter(d => d.st === 'critical');
  const bad      = withStatus.filter(d => d.st === 'bad');

  const monthLabel = monthsAhead === 0 ? '이번 달' : monthsAhead === 1 ? '다음 달' : `${monthsAhead}달 뒤`;

  document.getElementById('alerts').innerHTML = [
    ...critical.map(d => `<div class="alert-item alert-high"><span class="alert-dot"></span><span class="alert-text">⚠ 매우 나쁨 — ${d.name} 잔여 ${(d.remain ?? 0)}구좌 (부킹률 ${Number(d.bookPct).toFixed(1)}%, ${monthLabel})</span></div>`),
    ...bad.map(d      => `<div class="alert-item alert-mid"><span class="alert-dot"></span><span class="alert-text">○ 나쁨 — ${d.name} 잔여 ${(d.remain ?? 0)}구좌 (부킹률 ${Number(d.bookPct).toFixed(1)}%, ${monthLabel})</span></div>`)
  ].join('');
}



function destroyCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  for (const k in chartInstances) delete chartInstances[k];
}

function renderCards(data) {
  destroyCharts();
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = data.map((d, i) => {
    const col = getColors(d.bookPct);
    const isBus       = d.name === '경기버스' || d.kind === 'bus';
    const isTownboard = d.name === '타운보드S' || d.name === '타운보드L' || d.kind === 'townboard';
    const unit  = isBus ? '대' : '구좌';

    // 도넛 중앙 표시값
    let centerPct, centerLabel, totalPctDisp = '';
    if (isBus) {
      centerPct = d.bookPct;
      centerLabel = '집행률';
    } else if (isTownboard) {
      centerPct = d.bookPct;
      centerLabel = '송출률';
    } else {
      // 일반 매체: 도넛 중앙은 유가부킹률
      centerPct = (d.comTotal && d.paid != null) ? (d.paid / d.comTotal * 100) : null;
      centerLabel = '유가율';
      if (d.bookPct !== null && d.bookPct !== undefined) {
        totalPctDisp = '전체 ' + Number(d.bookPct).toFixed(1) + '%';
      }
    }
    const paidPctDisp = centerPct !== null && centerPct !== undefined ? centerPct.toFixed(1) + '%' : '-';

    // 카드 상태는 전체 부킹률 기준
    const st = getStatus(d.bookPct, getMonthsAhead(activeMonth));
    const remainDisp = d.remain !== null && d.remain !== undefined ? (Math.round(d.remain*10)/10) + unit : '-';
    const badgeMap = {
      excellent:['badge-excellent','매우 양호'],
      good:     ['badge-good','양호'],
      normal:   ['badge-normal','보통'],
      bad:      ['badge-bad','나쁨'],
      critical: ['badge-critical','매우 나쁨'],
      neutral:  ['','']
    };
    const [badgeCls, badgeTxt] = badgeMap[st];

    return `
      <div class="media-card status-${st}" onclick="openPanel('${d.name}')">
        ${badgeTxt ? `<span class="status-badge ${badgeCls}">${badgeTxt}</span>` : ''}
        <div class="media-name">${d.name}</div>
        <div class="donut-wrap">
          <canvas id="chart_${i}" width="120" height="120"></canvas>
          <div class="donut-center">
            <div class="donut-pct">${paidPctDisp}</div>
            <div class="donut-label">${centerLabel}</div>
            ${totalPctDisp ? `<div class="donut-total">${totalPctDisp}</div>` : ''}
          </div>
        </div>
        <div class="legend">
          ${isBus ? `
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">총 재원</span></span>
              <span class="legend-val">${d.comTotal != null ? Math.round(d.comTotal) : 0}대</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">집행</span></span>
              <span class="legend-val">${d.booked != null ? Math.round(d.booked) : 0}대</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">잔여</span></span>
              <span class="legend-val">${remainDisp}</span>
            </div>
          ` : isTownboard ? `
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">송출 합계</span></span>
              <span class="legend-val">${d.booked != null ? Math.round(d.booked*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">기준</span></span>
              <span class="legend-val">${d.comTotal != null ? d.comTotal : 25}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">패키지</span></span>
              <span class="legend-val">PKG</span>
            </div>
          ` : `
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">유가</span></span>
              <span class="legend-val">${d.paid != null ? Math.round(d.paid*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">서비스</span></span>
              <span class="legend-val">${d.svc != null ? Math.round(d.svc*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">잔여</span></span>
              <span class="legend-val">${remainDisp}</span>
            </div>
          `}
        </div>
        <span class="click-hint">광고주 보기 →</span>
      </div>
    `;
  }).join('');

  requestAnimationFrame(() => {
    data.forEach((d, i) => {
      const canvas = document.getElementById(`chart_${i}`);
      if (!canvas) return;
      const col      = getColors(d.bookPct);
      const remainVal = d.remain != null ? d.remain : 0;
      const isBus       = d.name === '경기버스' || d.kind === 'bus';
      const isTownboard = d.name === '타운보드S' || d.name === '타운보드L' || d.kind === 'townboard';
      // 차트 데이터: [유가/집행/송출, 서비스, 잔여]
      let vals;
      if (isBus) {
        vals = [(d.booked || 0), 0, remainVal];
      } else if (isTownboard) {
        const base = d.comTotal || 25;
        const sent = d.booked || 0;
        vals = [sent, 0, Math.max(0, base - sent)];
      } else {
        vals = d.comTotal != null ? [d.paid||0, d.svc||0, remainVal] : [d.paid||0, d.svc||0, 0];
      }
      chartInstances[`chart_${i}`] = new Chart(canvas, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: vals,
            backgroundColor: [col.paid, col.svc, col.remain],
            borderWidth: 0, hoverOffset: 5
          }]
        },
        options: {
          responsive: false, cutout: '70%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => {
              const labels = isBus ? ['집행', '', '잔여']
                : isTownboard ? ['송출', '', '여유']
                : ['유가','서비스','잔여'];
              const u = isBus ? '대' : '구좌';
              return ` ${labels[ctx.dataIndex]}: ${ctx.parsed}${u}`;
            }}}
          },
          animation: { duration: 600, easing: 'easeOutQuart' }
        }
      });
    });
  });
}

/* ═══════════════════════════════════════════
   RENDER — Slide Panel
═══════════════════════════════════════════ */
function renderPanel() {
  if (!panelMedia) return;
  const mediaData = ADVERTISERS[panelMedia];

  document.getElementById('panelEyebrow').textContent = '광고주 현황';
  document.getElementById('panelTitle').textContent   = panelMedia;

  document.getElementById('panelMonthTabs').innerHTML = MONTHS.map(m =>
    `<button class="panel-tab${m===panelMonth?' active':''}" onclick="setPanelMonth('${m}')">${m}</button>`
  ).join('');

  const mData = mediaData && mediaData[panelMonth]
    ? mediaData[panelMonth]
    : { total:null, booked:0, remain:null, list:[] };

  const isBus = panelMedia === '경기버스';
  const isTownboard = panelMedia === '타운보드S' || panelMedia === '타운보드L';
  const list = mData.list || [];

  if (isTownboard) {
    const totalSent = mData.totalSent || 0;
    const totalReal = mData.totalReal || 0;
    document.getElementById('panelSummary').innerHTML = `
      <div class="p-chip">
        <div class="p-chip-label">합계 송출</div>
        <div class="p-chip-val ok">${Number(totalSent).toFixed(1).replace(/\.0$/, '')}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">실 재원</div>
        <div class="p-chip-val">${Number(totalReal).toFixed(1).replace(/\.0$/, '')}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">광고주</div>
        <div class="p-chip-val">${list.length}건</div>
      </div>
    `;
  } else if (isBus) {
    // 경기버스: 총재원/집행/잔여 (대 단위)
    const pct = mData.bookPct;
    const pctCls = pct == null ? '' : pct >= 70 ? 'ok' : pct >= 40 ? 'warn' : 'danger';
    document.getElementById('panelSummary').innerHTML = `
      <div class="p-chip">
        <div class="p-chip-label">집행률</div>
        <div class="p-chip-val ${pctCls}">${pct !== null && pct !== undefined ? Number(pct).toFixed(1)+'%' : '-'}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">총 재원</div>
        <div class="p-chip-val">${mData.comTotal != null ? Math.round(mData.comTotal) : (mData.total != null ? Math.round(mData.total) : '-')}대</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">잔여 평균</div>
        <div class="p-chip-val">${mData.remain != null ? Math.round(mData.remain) : '-'}대</div>
      </div>
    `;
  } else {
    const bookedPct = mData.comTotal ? (mData.booked / mData.comTotal * 100).toFixed(1) : null;
    const pctCls    = bookedPct === null ? '' : bookedPct >= 70 ? 'ok' : bookedPct >= 40 ? 'warn' : 'danger';
    const normalSlot = mData.paid != null ? mData.paid : list.filter(a => a.type === '일반').reduce((s,a) => s + (a.slot||0), 0);
    const svcSlot    = mData.svc  != null ? mData.svc  : list.filter(a => a.type === '서비스').reduce((s,a) => s + (a.slot||0), 0);
    document.getElementById('panelSummary').innerHTML = `
      <div class="p-chip">
        <div class="p-chip-label">부킹률</div>
        <div class="p-chip-val ${pctCls}">${bookedPct !== null ? bookedPct+'%' : '-'}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">유가 구좌</div>
        <div class="p-chip-val ok">${Number(normalSlot).toFixed(2).replace(/\.?0+$/, '')}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">서비스 구좌</div>
        <div class="p-chip-val">${Number(svcSlot).toFixed(2).replace(/\.?0+$/, '')}</div>
      </div>
    `;
  }

  const body     = document.getElementById('panelBody');

  // 경기버스용 광고주 리스트 (구분: 나래/중앙, 컬럼: 광고주/수량/기간)
  if (isBus) {
    const narae   = list.filter(a => a.type === '나래');
    const central = list.filter(a => a.type === '중앙');
    function busRows(items) {
      if (!items.length) return '<div style="font-size:12px;color:var(--text3);padding:6px 10px;">-</div>';
      return `
        <div class="adv-row header-row" style="grid-template-columns: 1fr 50px 80px;">
          <span>광고주</span><span style="text-align:center">수량</span><span style="text-align:right">기간</span>
        </div>
        ${items.map(a => `
          <div class="adv-row" style="grid-template-columns: 1fr 50px 80px;">
            <span class="adv-name">${a.name}</span>
            <span class="adv-slot">${a.qty}대</span>
            <span class="adv-period">${a.period || '-'}</span>
          </div>
        `).join('')}
      `;
    }
    body.innerHTML = `
      <div class="adv-section-title"><span class="type-badge type-normal">나래</span> 나래 광고주</div>
      ${busRows(narae)}
      <div class="adv-section-title"><span class="type-badge type-service">중앙</span> 중앙 광고주</div>
      ${busRows(central)}
    `;
    return;
  }

  const normals  = list.filter(a => a.type === '일반');
  const services = list.filter(a => a.type === '서비스');

  // 타운보드: 패키지 정보 + 광고주 리스트
  const isTownboardPanel = panelMedia === '타운보드S' || panelMedia === '타운보드L';
  if (isTownboardPanel) {
    const advs = list || [];
    const ads      = advs.filter(a => a.type === '광고');
    const directs  = advs.filter(a => a.type === '바로광고');

    const renderAdvRow = (a) => `
      <div class="adv-row" style="grid-template-columns: 1fr 90px 70px;">
        <span class="adv-name">
          ${a.name}
          ${a.category ? `<span style="display:block;font-size:10px;color:var(--text3);margin-top:2px;font-weight:400">${a.category}${a.product ? ' · ' + a.product : ''}</span>` : ''}
        </span>
        <span class="adv-period">${a.period || '-'}</span>
        <span class="adv-slot">${a.slot}구좌</span>
      </div>
    `;

    body.innerHTML = `
      ${ads.length ? `
        <div class="adv-section-title"><span class="type-badge type-normal">광고</span> 광고 (${ads.length}건)</div>
        <div class="adv-row header-row" style="grid-template-columns: 1fr 90px 70px;">
          <span>캠페인</span><span style="text-align:right">기간</span><span style="text-align:right">구좌</span>
        </div>
        ${ads.map(renderAdvRow).join('')}
      ` : ''}
      ${directs.length ? `
        <div class="adv-section-title"><span class="type-badge type-service">바로</span> 바로광고 (${directs.length}건)</div>
        <div class="adv-row header-row" style="grid-template-columns: 1fr 90px 70px;">
          <span>캠페인</span><span style="text-align:right">기간</span><span style="text-align:right">구좌</span>
        </div>
        ${directs.map(renderAdvRow).join('')}
      ` : ''}
      ${!ads.length && !directs.length ? `<div class="empty-state">${activeMonth}에 운영 중인 광고가 없습니다</div>` : ''}
    `;
    return;
  }

  if (list.length === 0) {
    body.innerHTML = `<div class="empty-state">등록된 광고주가 없습니다</div>`;
    return;
  }

  function renderRows(items) {
    if (!items.length) return '<div style="font-size:12px;color:var(--text3);padding:6px 10px;">-</div>';
    return `
      <div class="adv-row header-row">
        <span>광고주</span><span style="text-align:center">RT</span><span style="text-align:center">구좌</span><span style="text-align:right">기간</span>
      </div>
      ${items.map(a => `
        <div class="adv-row">
          <span class="adv-name">${a.name}</span>
          <span class="adv-runtime">${a.runtime}s</span>
          <span class="adv-slot">${a.slot}</span>
          <span class="adv-period">${a.period || '-'}</span>
        </div>
      `).join('')}
    `;
  }

  body.innerHTML = `
    <div class="adv-section-title"><span class="type-badge type-normal">일반</span> 유가 광고주</div>
    ${renderRows(normals)}
    <div class="adv-section-title"><span class="type-badge type-service">서비스</span> 서비스 광고주</div>
    ${renderRows(services)}
  `;
}

function openPanel(mediaName) {
  panelMedia = mediaName;
  panelMonth = activeMonth;
  renderPanel();
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function setPanelMonth(m) {
  panelMonth = m;
  renderPanel();
}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
function render() {
  if (!activeMonth || !SUMMARY[activeMonth]) return;
  const data = SUMMARY[activeMonth];
  renderMonthTabs();
  renderAlerts(data);
  renderCards(data);
  renderTownboardSection();
}

function renderTownboardSection() {
  const grid = document.getElementById('townboardGrid');
  if (!grid) return;

  const TOWNBOARDS = ['타운보드S', '타운보드L'];
  grid.innerHTML = TOWNBOARDS.map(name => renderTownboardCard(name)).join('');
}

function renderTownboardCard(name) {
  const data = ADVERTISERS[name];
  if (!data) return '';
  const monthData = data[activeMonth] || {};
  const packages   = monthData.packages || [];
  const groups     = monthData.groups || {};
  const totalSent  = monthData.totalSent || 0;
  const totalReal  = monthData.totalReal || 0;
  const list       = monthData.list || [];

  const fmt = n => Number(n).toFixed(1).replace(/\.0$/, '');

  // 패키지 표 (전국F/A/B, 수도권F/A/B + 합계)
  const pkgRows = packages.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${fmt(p.sent)}</td>
      <td>${(p.ratio * 100).toFixed(0)}%</td>
      <td>${fmt(p.real)}</td>
    </tr>
  `).join('');

  // A/B 그룹
  let groupsHTML = '';
  if (groups.A || groups.B) {
    const renderG = (key, g) => {
      if (!g) return '';
      const overCls = g.pct && g.pct >= 100 ? 'over' : '';
      return `
        <div class="tb-group">
          <div class="tb-group-name">${key}그룹</div>
          <div class="tb-group-pct ${overCls}">${g.pct != null ? g.pct.toFixed(0) + '%' : '-'}</div>
          <div class="tb-group-detail">${fmt(g.real || 0)} / ${g.total}</div>
        </div>
      `;
    };
    groupsHTML = `
      <div class="tb-groups">
        ${renderG('A', groups.A)}
        ${renderG('B', groups.B)}
      </div>
    `;
  }

  // 광고주 카운트 - 활성 월의 광고주
  const adCount = list.filter(a => a.type === '광고').length;
  const directCount = list.filter(a => a.type === '바로광고').length;

  return `
    <div class="tb-card" onclick="openPanel('${name}')">
      <div class="tb-header">
        <span class="tb-name">${name}</span>
        <span class="tb-month-pill">${activeMonth}</span>
      </div>

      <div class="tb-summary">
        <div class="tb-stat">
          <div class="tb-stat-label">합계 송출</div>
          <div class="tb-stat-val accent">${fmt(totalSent)}</div>
        </div>
        <div class="tb-stat">
          <div class="tb-stat-label">실 재원</div>
          <div class="tb-stat-val">${fmt(totalReal)}</div>
        </div>
        <div class="tb-stat">
          <div class="tb-stat-label">광고주</div>
          <div class="tb-stat-val">${list.length}<span style="font-size:11px;font-weight:400;color:var(--text3)">건</span></div>
        </div>
      </div>

      <table class="tb-pkg-table">
        <thead>
          <tr>
            <th>패키지</th>
            <th>송출건</th>
            <th>비중</th>
            <th>실 재원</th>
          </tr>
        </thead>
        <tbody>
          ${pkgRows}
          <tr class="tb-total">
            <td>합계</td>
            <td>${fmt(totalSent)}</td>
            <td>-</td>
            <td>${fmt(totalReal)}</td>
          </tr>
        </tbody>
      </table>

      ${groupsHTML}
    </div>
  `;
}

function setMonth(m) { activeMonth = m; render(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

loadData();
</script>
</body>
</html>
