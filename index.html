<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 OOH 재원 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #f4f5f8;
  --bg2: #ffffff;
  --bg3: #eef0f4;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #111318;
  --text2: #5a6075;
  --text3: #9aa0b8;
  --accent: #3a6af8;
  --ok: #0c9060;
  --ok-bg: rgba(12,144,96,0.08);
  --warn: #b87200;
  --warn-bg: rgba(184,114,0,0.09);
  --danger: #d63c3c;
  --danger-bg: rgba(214,60,60,0.08);
  --radius: 14px;
  --font: 'Noto Sans KR', sans-serif;
  --mono: 'DM Mono', monospace;
  --panel-width: 480px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1.5rem 4rem;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 1rem;
}
.header-left { display: flex; flex-direction: column; gap: 4px; }
.header-eyebrow {
  font-size: 11px; font-weight: 500;
  letter-spacing: .12em; color: var(--accent);
  text-transform: uppercase; font-family: var(--mono);
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.week-badge {
  font-family: var(--mono); font-size: 11px;
  color: var(--text2); background: var(--bg3);
  border: 1px solid var(--border2);
  padding: 5px 12px; border-radius: 20px;
}

/* ── Month Tabs ── */
.month-tabs { display: flex; gap: 6px; margin-bottom: 1.75rem; flex-wrap: wrap; }
.month-tab {
  padding: 7px 18px; font-size: 13px;
  font-family: var(--font); font-weight: 500;
  border: 1px solid var(--border2); border-radius: 24px;
  cursor: pointer; color: var(--text2); background: transparent;
  transition: all .2s ease; letter-spacing: -.01em;
}
.month-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
.month-tab.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent); box-shadow: 0 0 16px rgba(79,124,255,0.35);
}

/* ── Alerts ── */
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
.alert-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px; border: 1px solid;
  animation: fadeIn .3s ease;
}
.alert-high { background: var(--danger-bg); border-color: rgba(255,87,87,0.3); color: #ff8a8a; }
.alert-mid  { background: var(--warn-bg);   border-color: rgba(240,165,0,0.3);  color: #f0c060; }
.alert-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.alert-high .alert-dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.alert-mid  .alert-dot { background: var(--warn);   box-shadow: 0 0 6px var(--warn); }
.alert-text { font-size: 12.5px; font-weight: 500; }



/* ── Section Title ── */
.section-title {
  font-size: 11px; font-weight: 500; letter-spacing: .1em;
  color: var(--text3); text-transform: uppercase; margin-bottom: 1rem;
}

/* ── Card Grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.media-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem 1rem 1rem;
  display: flex; flex-direction: column; align-items: center;
  position: relative; cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  animation: fadeIn .4s ease;
}
.media-card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.media-card.status-available { border-color: rgba(58,106,248,0.25); }
.media-card.status-normal    { border-color: rgba(14,144,96,0.25); }
.media-card.status-limited   { border-color: rgba(240,165,0,0.35); }
.media-card.status-soldout   { border-color: rgba(214,60,60,0.35); }
.media-card.status-available:hover { border-color: rgba(58,106,248,0.5);  box-shadow: 0 8px 32px rgba(58,106,248,0.1); }
.media-card.status-normal:hover    { border-color: rgba(14,144,96,0.5);   box-shadow: 0 8px 32px rgba(14,144,96,0.1); }
.media-card.status-limited:hover   { border-color: rgba(240,165,0,0.6);   box-shadow: 0 8px 32px rgba(240,165,0,0.12); }
.media-card.status-soldout:hover   { border-color: rgba(214,60,60,0.6);   box-shadow: 0 8px 32px rgba(214,60,60,0.12); }

.click-hint {
  position: absolute; bottom: 10px; right: 12px;
  font-size: 10px; color: var(--text3); font-family: var(--mono);
  opacity: 0; transition: opacity .2s;
}
.media-card:hover .click-hint { opacity: 1; }

.status-badge {
  position: absolute; top: 11px; right: 11px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 10px; letter-spacing: .04em; font-family: var(--mono);
}
.badge-available { background: rgba(58,106,248,0.08);  color: #3a6af8; border: 1px solid rgba(58,106,248,0.25); }
.badge-normal    { background: var(--ok-bg);              color: var(--ok);  border: 1px solid rgba(14,144,96,0.25); }
.badge-limited   { background: var(--warn-bg);            color: var(--warn);border: 1px solid rgba(240,165,0,0.3); }
.badge-soldout   { background: var(--danger-bg);          color: var(--danger); border: 1px solid rgba(214,60,60,0.3); }

.media-name { font-size: 13px; font-weight: 700; margin-bottom: 14px; text-align: center; letter-spacing: -.01em; padding-right: 40px; width: 100%; }

.donut-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 14px; flex-shrink: 0; }
.donut-wrap canvas { position: absolute; top: 0; left: 0; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-pct { font-size: 20px; font-weight: 700; font-family: var(--mono); line-height: 1.1; letter-spacing: -.02em; }
.donut-label { font-size: 9px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.donut-total { font-size: 9px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

.legend { display: flex; flex-direction: column; gap: 6px; width: 100%; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
.legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; }
.legend-left { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.legend-key { color: var(--text2); }
.legend-val { font-weight: 500; font-family: var(--mono); font-size: 11px; }

/* ── Overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0); z-index: 100;
  pointer-events: none; transition: background .3s ease;
}
.overlay.open { background: rgba(0,0,0,0.55); pointer-events: all; }

/* ── Slide Panel ── */
.slide-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: var(--panel-width); max-width: 100vw;
  background: #ffffff;
  border-left: 1px solid var(--border2);
  z-index: 101;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.slide-panel.open { transform: translateX(0); }

.panel-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  flex-shrink: 0;
}
.panel-title-wrap { display: flex; flex-direction: column; gap: 4px; }
.panel-eyebrow { font-size: 11px; color: var(--text3); letter-spacing: .08em; font-family: var(--mono); text-transform: uppercase; }
.panel-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.panel-close {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; margin-top: 2px;
}
.panel-close:hover { background: var(--border2); color: var(--text); }

/* Panel month tabs */
.panel-month-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 10px 0; font-size: 12px; font-weight: 500;
  text-align: center; cursor: pointer; color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: all .15s; background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.panel-tab:hover { color: var(--text2); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panel summary chips */
.panel-summary {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
  padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.p-chip { background: var(--bg3); border-radius: 8px; padding: 8px 10px; text-align: center; }
.p-chip-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
.p-chip-val { font-size: 15px; font-weight: 700; font-family: var(--mono); }
.p-chip-val.ok { color: var(--ok); }
.p-chip-val.warn { color: var(--warn); }
.p-chip-val.danger { color: var(--danger); }

/* Panel advertiser list */
.panel-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 2rem; }
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.adv-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text3);
  margin: 1rem 0 6px; display: flex; align-items: center; gap: 8px;
}
.adv-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.adv-row {
  display: grid;
  grid-template-columns: 1fr 56px 40px 70px;
  gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 8px;
  margin-bottom: 4px; transition: background .15s;
  animation: fadeIn .25s ease;
}
.adv-row:hover { background: var(--bg3); }
.adv-row.header-row {
  font-size: 10px; color: var(--text3); font-weight: 500;
  letter-spacing: .04em; padding: 4px 10px; margin-bottom: 2px;
  pointer-events: none;
}
.adv-name { font-size: 13px; font-weight: 500; color: var(--text); }
.adv-runtime { font-size: 11px; color: var(--text2); font-family: var(--mono); text-align: center; }
.adv-slot { font-size: 12px; font-weight: 700; font-family: var(--mono); text-align: center; }
.adv-period { font-size: 10px; color: var(--text3); font-family: var(--mono); text-align: right; }
.type-badge {
  display: inline-block; font-size: 9px; padding: 2px 5px;
  border-radius: 4px; font-weight: 700; margin-right: 4px; vertical-align: middle;
  font-family: var(--mono); letter-spacing: .03em;
}
.type-normal  { background: rgba(79,124,255,0.15); color: #7fa8ff; }
.type-service { background: rgba(34,201,138,0.12); color: #22c98a; }

.empty-state {
  text-align: center; padding: 3rem 1rem;
  color: var(--text3); font-size: 13px;
}

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Loading Spinner ── */
.spinner {
  width: 32px; height: 32px; margin: 0 auto;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 640px) {
  body { padding: 1.25rem 1rem 3rem; }
  .summary-row { grid-template-columns: repeat(2,1fr); }
  .card-grid { grid-template-columns: repeat(2,1fr); }
  header h1 { font-size: 18px; }
  :root { --panel-width: 100vw; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-eyebrow">JoongAng BizSolutions</span>
    <h1>2026 OOH 재원 현황</h1>
  </div>
  <span class="week-badge">4월 3주차 기준</span>
</header>

<div class="month-tabs" id="monthTabs"></div>
<div class="alerts" id="alerts"></div>
<p class="section-title">매체별 부킹 현황 — 클릭하면 광고주 리스트를 볼 수 있어요</p>
<div class="card-grid" id="cardGrid"></div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Slide Panel -->
<div class="slide-panel" id="slidePanel">
  <div class="panel-header">
    <div class="panel-title-wrap">
      <span class="panel-eyebrow" id="panelEyebrow">광고주 현황</span>
      <span class="panel-title" id="panelTitle">-</span>
    </div>
    <button class="panel-close" onclick="closePanel()">&#x2715;</button>
  </div>
  <div class="panel-month-tabs" id="panelMonthTabs"></div>
  <div class="panel-summary" id="panelSummary"></div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxWbr_JTrsUJKZbkNPOGBHTZkVqzvtqC2khpCgi_dw1uhj5hhuXwicxKi_LJSepdEomDQ/exec";

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let SUMMARY = {};
let ADVERTISERS = {};
let MONTHS = [];
let activeMonth = "";
let panelMedia = null;
let panelMonth = "";
const chartInstances = {};

/* ═══════════════════════════════════════════
   FETCH DATA
═══════════════════════════════════════════ */
function showLoading() {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)">
      <div class="spinner"></div>
      <p style="margin-top:1rem;font-size:13px">시트에서 데이터를 불러오는 중...</p>
    </div>`;
}

function showError(msg) {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--danger)">
      <p style="font-size:13px">⚠ 데이터를 불러오지 못했어요</p>
      <p style="font-size:11px;margin-top:6px;color:var(--text3)">${msg}</p>
    </div>`;
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch(GAS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    SUMMARY     = json.summary     || {};
    ADVERTISERS = json.advertisers || {};
    MONTHS      = Object.keys(SUMMARY);
    activeMonth = MONTHS[0] || "";
    panelMonth  = activeMonth;

    // 주차 라벨 업데이트
    const badge = document.querySelector('.week-badge');
    if (json.weekLabel) {
      badge.textContent = json.weekLabel;
    } else {
      // weekLabel 없으면 summary 마지막 키에서 추출
      const months = Object.keys(json.summary || {});
      if (months.length) badge.textContent = months[months.length - 1] + ' 기준';
    }

    render();
  } catch (e) {
    showError(e.message);
    console.error(e);
  }
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function getStatus(pct) {
  if (pct === null || pct === undefined) return 'neutral';
  if (pct >= 100) return 'soldout';
  if (pct >= 80)  return 'limited';
  if (pct >= 40)  return 'normal';
  return 'available';
}
function getColors(pct) {
  // 유가: 파랑 계열 (좋은 것), 서비스: 주황 계열 (중립/경고), 잔여: 회색
  return { paid:'#3a6af8', svc:'#f0a500', remain:'#e4e7ef' };
}

/* ═══════════════════════════════════════════
   RENDER — Main Dashboard
═══════════════════════════════════════════ */
function renderMonthTabs() {
  document.getElementById('monthTabs').innerHTML = MONTHS.map(m =>
    `<button class="month-tab${m===activeMonth?' active':''}" onclick="setMonth('${m}')">${m}</button>`
  ).join('');
}

function renderAlerts(data) {

  // 전체 부킹률 기준 알림
  const soldout  = data.filter(d => d.bookPct !== null && d.bookPct >= 100);
  const limited  = data.filter(d => d.bookPct !== null && d.bookPct >= 80 && d.bookPct < 100);
  const available = data.filter(d => d.bookPct !== null && d.bookPct < 40 && d.remain !== null && d.remain >= 5);
  document.getElementById('alerts').innerHTML = [
    ...soldout.map(d  => `<div class="alert-item alert-high"><span class="alert-dot"></span><span class="alert-text">● 마감 — ${d.name} 재원 100% 소진</span></div>`),
    ...limited.map(d  => `<div class="alert-item alert-high"><span class="alert-dot"></span><span class="alert-text">⚠ 마감 임박 — ${d.name} 부킹률 ${Number(d.bookPct).toFixed(1)}%</span></div>`),
    ...available.map(d => `<div class="alert-item alert-mid"><span class="alert-dot"></span><span class="alert-text">◎ 여유 — ${d.name} 잔여 ${d.remain}구좌 (부킹률 ${Number(d.bookPct).toFixed(1)}%)</span></div>`)
  ].join('');
}



function destroyCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  for (const k in chartInstances) delete chartInstances[k];
}

function renderCards(data) {
  destroyCharts();
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = data.map((d, i) => {
    const col = getColors(d.bookPct);

    // 도넛 중앙: 유가부킹률 표시
    const paidPct = (d.comTotal && d.paid != null)
      ? (d.paid / d.comTotal * 100)
      : null;
    const paidPctDisp = paidPct !== null ? paidPct.toFixed(1) + '%' : '-';

    // 전체 부킹률 (도넛 하단 소표시용)
    const totalPctDisp = d.bookPct !== null && d.bookPct !== undefined
      ? '전체 ' + Number(d.bookPct).toFixed(1) + '%'
      : '';

    // 카드 상태는 전체 부킹률 기준
    const st = getStatus(d.bookPct);
    const remainDisp = d.remain !== null && d.remain !== undefined ? d.remain + '구좌' : '-';
    const badgeMap = { soldout:['badge-soldout','마감'], limited:['badge-limited','임박'], normal:['badge-normal','보통'], available:['badge-available','여유'], neutral:['',''] };
    const [badgeCls, badgeTxt] = badgeMap[st];

    return `
      <div class="media-card status-${st}" onclick="openPanel('${d.name}')">
        ${badgeTxt ? `<span class="status-badge ${badgeCls}">${badgeTxt}</span>` : ''}
        <div class="media-name">${d.name}</div>
        <div class="donut-wrap">
          <canvas id="chart_${i}" width="120" height="120"></canvas>
          <div class="donut-center">
            <div class="donut-pct">${paidPctDisp}</div>
            <div class="donut-label">유가율</div>
            ${totalPctDisp ? `<div class="donut-total">${totalPctDisp}</div>` : ''}
          </div>
        </div>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">유가</span></span>
            <span class="legend-val">${d.paid ?? 0}구좌</span>
          </div>
          <div class="legend-item">
            <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">서비스</span></span>
            <span class="legend-val">${d.svc ?? 0}구좌</span>
          </div>
          <div class="legend-item">
            <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">잔여</span></span>
            <span class="legend-val">${remainDisp}</span>
          </div>
        </div>
        <span class="click-hint">광고주 보기 →</span>
      </div>
    `;
  }).join('');

  requestAnimationFrame(() => {
    data.forEach((d, i) => {
      const canvas = document.getElementById(`chart_${i}`);
      if (!canvas) return;
      const col      = getColors(d.bookPct);
      const remainVal = d.remain != null ? d.remain : 0;
      const vals = d.comTotal != null ? [d.paid||0, d.svc||0, remainVal] : [d.paid||0, d.svc||0, 0];
      chartInstances[`chart_${i}`] = new Chart(canvas, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: vals,
            backgroundColor: [col.paid, col.svc, col.remain],
            borderWidth: 0, hoverOffset: 5
          }]
        },
        options: {
          responsive: false, cutout: '70%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => ` ${['유가','서비스','잔여'][ctx.dataIndex]}: ${ctx.parsed}구좌` } }
          },
          animation: { duration: 600, easing: 'easeOutQuart' }
        }
      });
    });
  });
}

/* ═══════════════════════════════════════════
   RENDER — Slide Panel
═══════════════════════════════════════════ */
function renderPanel() {
  if (!panelMedia) return;
  const mediaData = ADVERTISERS[panelMedia];

  document.getElementById('panelEyebrow').textContent = '광고주 현황';
  document.getElementById('panelTitle').textContent   = panelMedia;

  document.getElementById('panelMonthTabs').innerHTML = MONTHS.map(m =>
    `<button class="panel-tab${m===panelMonth?' active':''}" onclick="setPanelMonth('${m}')">${m}</button>`
  ).join('');

  const mData = mediaData && mediaData[panelMonth]
    ? mediaData[panelMonth]
    : { total:null, booked:0, remain:null, list:[] };

  const bookedPct = mData.total ? (mData.booked / mData.total * 100).toFixed(1) : null;
  const pctCls    = bookedPct === null ? '' : bookedPct >= 70 ? 'ok' : bookedPct >= 40 ? 'warn' : 'danger';
  const list      = mData.list || [];
  const normalSlot = list.filter(a => a.type === '일반').reduce((s,a) => s + (a.slot||0), 0);
  const svcSlot    = list.filter(a => a.type === '서비스').reduce((s,a) => s + (a.slot||0), 0);

  document.getElementById('panelSummary').innerHTML = `
    <div class="p-chip">
      <div class="p-chip-label">부킹률</div>
      <div class="p-chip-val ${pctCls}">${bookedPct !== null ? bookedPct+'%' : '-'}</div>
    </div>
    <div class="p-chip">
      <div class="p-chip-label">유가 구좌</div>
      <div class="p-chip-val ok">${Number(normalSlot).toFixed(2).replace(/\.?0+$/, '')}</div>
    </div>
    <div class="p-chip">
      <div class="p-chip-label">서비스 구좌</div>
      <div class="p-chip-val">${Number(svcSlot).toFixed(2).replace(/\.?0+$/, '')}</div>
    </div>
  `;

  const body     = document.getElementById('panelBody');
  const normals  = list.filter(a => a.type === '일반');
  const services = list.filter(a => a.type === '서비스');

  if (list.length === 0) {
    body.innerHTML = `<div class="empty-state">등록된 광고주가 없습니다</div>`;
    return;
  }

  function renderRows(items) {
    if (!items.length) return '<div style="font-size:12px;color:var(--text3);padding:6px 10px;">-</div>';
    return `
      <div class="adv-row header-row">
        <span>광고주</span><span style="text-align:center">RT</span><span style="text-align:center">구좌</span><span style="text-align:right">기간</span>
      </div>
      ${items.map(a => `
        <div class="adv-row">
          <span class="adv-name">${a.name}</span>
          <span class="adv-runtime">${a.runtime}s</span>
          <span class="adv-slot">${a.slot}</span>
          <span class="adv-period">${a.period || '-'}</span>
        </div>
      `).join('')}
    `;
  }

  body.innerHTML = `
    <div class="adv-section-title"><span class="type-badge type-normal">일반</span> 유가 광고주</div>
    ${renderRows(normals)}
    <div class="adv-section-title"><span class="type-badge type-service">서비스</span> 서비스 광고주</div>
    ${renderRows(services)}
  `;
}

function openPanel(mediaName) {
  panelMedia = mediaName;
  panelMonth = activeMonth;
  renderPanel();
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function setPanelMonth(m) {
  panelMonth = m;
  renderPanel();
}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
function render() {
  if (!activeMonth || !SUMMARY[activeMonth]) return;
  const data = SUMMARY[activeMonth];
  renderMonthTabs();
  renderAlerts(data);
  renderCards(data);
}

function setMonth(m) { activeMonth = m; render(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

loadData();
</script>
</body>
</html>
