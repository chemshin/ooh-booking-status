<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 OOH 재원 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #f4f5f8;
  --bg2: #ffffff;
  --bg3: #eef0f4;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #111318;
  --text2: #5a6075;
  --text3: #9aa0b8;
  --accent: #3a6af8;
  --ok: #0c9060;
  --ok-bg: rgba(12,144,96,0.08);
  --warn: #b87200;
  --warn-bg: rgba(184,114,0,0.09);
  --danger: #d63c3c;
  --danger-bg: rgba(214,60,60,0.08);
  --radius: 14px;
  --font: 'Noto Sans KR', sans-serif;
  --mono: 'DM Mono', monospace;
  --panel-width: min(96vw, 1080px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1.5rem 4rem;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 1rem;
}
.header-left { display: flex; flex-direction: column; gap: 4px; }
.header-eyebrow {
  font-size: 11px; font-weight: 500;
  letter-spacing: .12em; color: var(--accent);
  text-transform: uppercase; font-family: var(--mono);
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }

.week-badge {
  font-family: var(--mono); font-size: 11px;
  color: var(--text2); background: var(--bg3);
  border: 1px solid var(--border2);
  padding: 5px 12px; border-radius: 20px;
}

/* ── Month Tabs ── */
.month-tabs {
  display: flex; gap: 6px; margin-bottom: 1.75rem;
  overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin;
}
.month-tabs::-webkit-scrollbar { height: 4px; }
.month-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
.month-tab { flex-shrink: 0; }
.month-tab {
  padding: 7px 18px; font-size: 13px;
  font-family: var(--font); font-weight: 500;
  border: 1px solid var(--border2); border-radius: 24px;
  cursor: pointer; color: var(--text2); background: transparent;
  transition: all .2s ease; letter-spacing: -.01em;
}
.month-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
.month-tab.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent); box-shadow: 0 0 16px rgba(79,124,255,0.35);
}

/* ── Alerts ── */
.alert-mid  { background: var(--warn-bg);   border-color: rgba(240,165,0,0.3);  color: #f0c060; }
.alert-high .alert-mid  


/* ── Section ── */
.section-block { margin-bottom: 2.5rem; }
.section-header {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 1rem; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-num {
  font-size: 11px; font-weight: 700; font-family: var(--mono);
  color: var(--accent); letter-spacing: .08em;
  background: rgba(58,106,248,0.08);
  padding: 3px 8px; border-radius: 6px;
}
.section-title-large {
  font-size: 17px; font-weight: 700; letter-spacing: -.02em;
  color: var(--text);
}
.section-desc {
  font-size: 12px; color: var(--text3); margin-left: auto;
}
.section-title {
  font-size: 11px; font-weight: 500; letter-spacing: .1em;
  color: var(--text3); text-transform: uppercase; margin-bottom: 1rem;
}

/* ── Townboard Grid ── */
.tb-stat-val.ok     { color: var(--ok); }
.tb-stat-val.warn   { color: var(--warn); }

/* 패키지 표 (전국F/A/B, 수도권F/A/B) */

/* A/B 그룹 표시 */

/* ── Card Grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.media-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem 1rem 1rem;
  display: flex; flex-direction: column; align-items: center;
  position: relative; cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  animation: fadeIn .4s ease;
}
.media-card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
/* ── 범례 하위 항목 (유가/서비스) ── */
.legend-item.sub {
  padding-left: 14px;
  font-size: 10.5px;
  opacity: 0.88;
}
.legend-key.sub, .legend-val.sub {
  font-size: 10.5px;
  color: var(--text2);
  font-weight: 400;
}
.legend-sub-dot {
  width: 8px; height: 8px;
  display: inline-block;
  flex-shrink: 0;
}

.media-card.status-excellent { border-color: rgba(58,106,248,0.30); }
.media-card.status-good      { border-color: rgba(14,144,96,0.25); }
.media-card.status-normal    { border-color: rgba(150,150,150,0.20); }
.media-card.status-bad       { border-color: rgba(240,165,0,0.35); }
.media-card.status-critical  { border-color: rgba(214,60,60,0.40); }
.media-card.status-excellent:hover { border-color: rgba(58,106,248,0.55); box-shadow: 0 8px 32px rgba(58,106,248,0.10); }
.media-card.status-good:hover      { border-color: rgba(14,144,96,0.5);   box-shadow: 0 8px 32px rgba(14,144,96,0.10); }
.media-card.status-normal:hover    { border-color: rgba(150,150,150,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
.media-card.status-bad:hover       { border-color: rgba(240,165,0,0.6);   box-shadow: 0 8px 32px rgba(240,165,0,0.12); }
.media-card.status-critical:hover  { border-color: rgba(214,60,60,0.65);  box-shadow: 0 8px 32px rgba(214,60,60,0.13); }

.click-hint {
  position: absolute; bottom: 10px; right: 12px;
  font-size: 10px; color: var(--text3); font-family: var(--mono);
  opacity: 0; transition: opacity .2s;
}
.media-card:hover .click-hint { opacity: 1; }

.status-badge {
  position: absolute; top: 11px; right: 11px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 10px; letter-spacing: .04em; font-family: var(--mono);
}
.badge-excellent { background: rgba(58,106,248,0.10); color: #3a6af8; border: 1px solid rgba(58,106,248,0.3); }
.badge-good      { background: var(--ok-bg);             color: var(--ok);  border: 1px solid rgba(14,144,96,0.25); }
.badge-normal    { background: rgba(150,150,150,0.10);   color: #777;       border: 1px solid rgba(150,150,150,0.25); }
.badge-bad       { background: var(--warn-bg);           color: var(--warn);border: 1px solid rgba(240,165,0,0.3); }
.badge-critical  { background: var(--danger-bg);         color: var(--danger); border: 1px solid rgba(214,60,60,0.3); }

.media-name { font-size: 13px; font-weight: 700; margin-bottom: 14px; text-align: center; letter-spacing: -.01em; padding-right: 40px; width: 100%; }

.donut-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 14px; flex-shrink: 0; }
.donut-wrap canvas { position: absolute; top: 0; left: 0; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-pct { font-size: 20px; font-weight: 700; font-family: var(--mono); line-height: 1.1; letter-spacing: -.02em; }
.donut-label { font-size: 9px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.donut-total { font-size: 9px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

.legend { display: flex; flex-direction: column; gap: 6px; width: 100%; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
.legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; }
.legend-left { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.legend-key { color: var(--text2); }
.legend-val { font-weight: 500; font-family: var(--mono); font-size: 11px; }

/* ── Overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0); z-index: 100;
  pointer-events: none; transition: background .3s ease;
}
.overlay.open { background: rgba(0,0,0,0.55); pointer-events: all; }

/* ── Slide Panel ── */
.slide-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: var(--panel-width); max-width: 100vw;
  background: #ffffff;
  border-left: 1px solid var(--border2);
  z-index: 101;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.slide-panel.open { transform: translateX(0); }

.panel-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  flex-shrink: 0;
}
.panel-title-wrap { display: flex; flex-direction: column; gap: 4px; }
.panel-eyebrow { font-size: 11px; color: var(--text3); letter-spacing: .08em; font-family: var(--mono); text-transform: uppercase; }
.panel-title { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.panel-close {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; margin-top: 2px;
}
.panel-close:hover { background: var(--border2); color: var(--text); }

/* Panel month tabs */
.panel-month-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.panel-month-tabs::-webkit-scrollbar { height: 3px; }
.panel-month-tabs::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
.panel-tab {
  flex-shrink: 0; min-width: 70px;
  padding: 10px 12px; font-size: 12px; font-weight: 500;
  text-align: center; cursor: pointer; color: var(--text3);
  border-bottom: 2px solid transparent;
  transition: all .15s; background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.panel-tab:hover { color: var(--text2); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panel summary chips */
.panel-summary {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
  padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.p-chip { background: var(--bg3); border-radius: 8px; padding: 8px 10px; text-align: center; }
.p-chip-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
.p-chip-val { font-size: 15px; font-weight: 700; font-family: var(--mono); }

/* ── 패널 스택 막대 그래프 ── */
.panel-bar-wrap {
  grid-column: 1 / -1;  /* panel-summary grid 전체 차지 */
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 16px;
  background: var(--bg3); border-radius: 12px;
}
.panel-bar-header {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
}
.panel-bar-pct {
  display: flex; align-items: baseline; gap: 8px;
}
.panel-bar-pct-label {
  font-size: 11px; color: var(--text3); font-weight: 500;
  letter-spacing: .04em; text-transform: uppercase;
}
.panel-bar-pct-val {
  font-size: 22px; font-weight: 700; font-family: var(--mono);
  letter-spacing: -.02em;
}
.panel-bar-pct-val.ok     { color: var(--ok); }
.panel-bar-pct-val.warn   { color: var(--warn); }
.panel-bar-pct-val.danger { color: var(--danger); }
.panel-bar-total {
  font-size: 12px; color: var(--text2); font-family: var(--mono);
}
.panel-bar-total strong { color: var(--text); font-weight: 700; margin-right: 4px; }

.panel-bar {
  display: flex; height: 32px;
  border-radius: 8px; overflow: hidden;
  background: var(--bg2);
  border: 1px solid var(--border);
}
.panel-bar-fill,
.panel-bar-service,
.panel-bar-remain {
  display: flex; align-items: center; justify-content: center;
  height: 100%;
  color: #fff;
  font-size: 12.5px; font-weight: 700; font-family: var(--mono);
  letter-spacing: -.01em;
  min-width: 0;
  transition: width .5s ease;
  position: relative;
}
/* 일반 (유가) — 파랑 */
.panel-bar-fill {
  background: linear-gradient(180deg, #5b87ff 0%, #3a6af8 100%);
}
.panel-bar-fill::after {
  content: '일반';
  position: absolute;
  font-size: 9px; font-weight: 500;
  opacity: 0.9;
  top: 3px; right: 6px;
  letter-spacing: 0.04em;
}
/* 서비스 — 주황 */
.panel-bar-service {
  background: linear-gradient(180deg, #f5b232 0%, #f0a500 100%);
}
.panel-bar-service::after {
  content: '서비스';
  position: absolute;
  font-size: 9px; font-weight: 500;
  opacity: 0.9;
  top: 3px; right: 6px;
  letter-spacing: 0.04em;
}
/* 잔여 — 회색 배경 */
.panel-bar-remain {
  background: var(--bg);
  color: var(--text2);
}
.panel-bar-remain::after {
  content: '잔여';
  position: absolute;
  font-size: 9px; font-weight: 500;
  opacity: 0.7;
  top: 3px; right: 6px;
  letter-spacing: 0.04em;
}
.panel-bar-val-text {
  white-space: nowrap;
  overflow: hidden;
  padding: 0 6px;
}
.p-chip-val.ok { color: var(--ok); }
.p-chip-val.warn { color: var(--warn); }
.p-chip-val.danger { color: var(--danger); }
.p-chip-val.excellent { color: #3a6af8; }
.p-chip-val.good { color: var(--ok); }
.p-chip-val.normal { color: #777; }
.p-chip-val.bad { color: var(--warn); }
.p-chip-val.critical { color: var(--danger); }

/* Panel advertiser list */
.panel-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 2rem; }
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.adv-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text3);
  margin: 1rem 0 6px; display: flex; align-items: center; gap: 8px;
}
.adv-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.adv-row {
  display: grid;
  grid-template-columns: 1fr 56px 40px 70px;
  gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 8px;
  margin-bottom: 4px; transition: background .15s;
  animation: fadeIn .25s ease;
}
.adv-row:hover { background: var(--bg3); }
.adv-row.header-row {
  font-size: 10px; color: var(--text3); font-weight: 500;
  letter-spacing: .04em; padding: 4px 10px; margin-bottom: 2px;
  pointer-events: none;
}
.adv-name { font-size: 13px; font-weight: 500; color: var(--text); }
.adv-runtime { font-size: 11px; color: var(--text2); font-family: var(--mono); text-align: center; }
.adv-slot { font-size: 12px; font-weight: 700; font-family: var(--mono); text-align: center; }
.adv-period { font-size: 10px; color: var(--text3); font-family: var(--mono); text-align: right; }

/* ── 편성표 (간트 차트) ── */
.schedule-wrap {
  margin-bottom: 1.25rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg2);
  overflow: hidden;
}
.schedule-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.schedule-scroll::-webkit-scrollbar { height: 6px; }
.schedule-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }

.schedule-table {
  display: grid;
  grid-template-columns: 150px repeat(31, 1fr);
  font-size: 11px;
  min-width: 900px;
  width: 100%;
}
.sch-cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 0;
  text-align: center;
  font-family: var(--mono);
  color: var(--text3);
  background: var(--bg2);
}
.sch-cell.first { border-left: 0; }
.sch-cell.day-header {
  font-size: 11px;
  font-weight: 600;
  background: var(--bg3);
  position: sticky; top: 0;
  padding: 6px 0;
}
.sch-cell.day-header.weekend { color: var(--danger); }
.sch-cell.day-header.saturday { color: var(--accent); }
.sch-cell.name {
  text-align: left;
  padding: 6px 10px;
  font-family: var(--font);
  font-size: 12.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--bg2);
  position: sticky; left: 0;
  z-index: 1;
  border-right: 1px solid var(--border2);
}
.sch-cell.name.normal-type { color: var(--text); }
.sch-cell.name.service-type { color: var(--text2); }
.sch-day {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  height: 28px;
  position: relative;
}
.sch-day.weekend { background: rgba(214,60,60,0.03); }
.sch-day.today { background: rgba(58,106,248,0.08); }

.sch-bar {
  position: absolute;
  /* top/bottom은 구좌수에 따라 인라인 style로 설정 */
  left: 0; right: 0;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 1px 2px rgba(58,106,248,0.2);
}

/* ── 광고주명 옆 구좌 뱃지 ── */
.sch-name-wrap {
  display: flex; align-items: center; gap: 4px;
  overflow: hidden;
}
.sch-name-text {
  flex: 1; min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rt-badge {
  flex-shrink: 0;
  font-size: 9.5px;
  font-family: var(--mono);
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 4px;
  line-height: 1;
  letter-spacing: -.02em;
}
/* 초수별 색상 차등 — 짧을수록 옅게 */
.rt-badge.rt-15 { background: rgba(120,130,150,0.08); color: rgba(100,110,130,0.7); }
.rt-badge.rt-20 { background: rgba(80,100,140,0.12);  color: rgba(80,100,140,0.85); }
.rt-badge.rt-30 { background: rgba(58,106,248,0.12);  color: var(--accent); }
.rt-badge.rt-60 { background: rgba(214,60,60,0.12);   color: var(--danger); }

.slot-badge {
  flex-shrink: 0;
  font-size: 9.5px;
  font-family: var(--mono);
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 4px;
  background: rgba(58,106,248,0.10);
  color: var(--accent);
  line-height: 1;
}
.slot-badge.half {
  background: rgba(150,150,150,0.15);
  color: var(--text3);
}
.slot-badge.large {
  background: rgba(214,60,60,0.10);
  color: var(--danger);
}
.slot-badge.svc {
  background: rgba(240,165,0,0.15);
  color: var(--warn);
}
.sch-bar.type-normal { background: #3a6af8; }
.sch-bar.type-service { background: #f0a500; }
.sch-bar.type-package { background: #9966ff; }
.sch-bar.type-sponsor { background: #14a085; }
.sch-bar.type-barter  { background: #888; }
.sch-bar.start { border-top-left-radius: 6px; border-bottom-left-radius: 6px; left: 3px; }
.sch-bar.end   { border-top-right-radius: 6px; border-bottom-right-radius: 6px; right: 3px; }

.sch-section-title {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 8px;
  font-size: 11px; font-weight: 600;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  color: var(--text2);
}
.sch-empty {
  padding: 24px 12px;
  text-align: center;
  font-size: 12px;
  color: var(--text3);
}
.type-badge {
  display: inline-block; font-size: 9px; padding: 2px 5px;
  border-radius: 4px; font-weight: 700; margin-right: 4px; vertical-align: middle;
  font-family: var(--mono); letter-spacing: .03em;
}
.type-normal  { background: rgba(79,124,255,0.15); color: #7fa8ff; }
.type-service { background: rgba(34,201,138,0.12); color: #22c98a; }

.empty-state {
  text-align: center; padding: 3rem 1rem;
  color: var(--text3); font-size: 13px;
}

/* ── Animations ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Loading Spinner ── */
.spinner {
  width: 32px; height: 32px; margin: 0 auto;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 768px) {
  .section-header { flex-wrap: wrap; }
  .section-desc { width: 100%; margin-left: 0; margin-top: 4px; font-size: 11px; }
  }
@media (max-width: 640px) {
  body { padding: 1.25rem 1rem 3rem; }
  .summary-row { grid-template-columns: repeat(2,1fr); }
  .card-grid { grid-template-columns: repeat(2,1fr); }
  header h1 { font-size: 18px; }
  :root { --panel-width: 100vw; }
}



/* ── 라이트박스 & 아트월 표 ── */
.lb-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.lb-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.lb-scroll::-webkit-scrollbar { height: 6px; }
.lb-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }

.lb-table {
  display: grid;
  grid-template-columns: 80px 130px repeat(12, minmax(60px, 1fr));
  min-width: 1050px;
  font-size: 11.5px;
}
.lb-cell {
  padding: 8px 10px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  font-family: var(--font);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lb-cell.header {
  font-size: 11px;
  font-weight: 600;
  background: var(--bg3);
  color: var(--text2);
  text-align: center;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.lb-cell.header.weekend { color: var(--danger); }
.lb-cell.category {
  background: var(--bg3);
  font-weight: 700;
  color: var(--text);
  text-align: center;
  border-right: 1px solid var(--border2);
}
.lb-cell.media {
  font-weight: 500;
  color: var(--text);
  background: var(--bg2);
  border-right: 1px solid var(--border2);
}
.lb-cell.value {
  color: var(--text);
  font-size: 11px;
  text-align: center;
  background: var(--bg2);
}
.lb-cell.value.has-ad {
  background: rgba(58,106,248,0.06);
  color: var(--accent);
  font-weight: 500;
}
.lb-cell.value.completed {
  background: rgba(14,144,96,0.07);
  color: var(--ok);
}
.lb-cell.value.tentative {
  background: rgba(240,165,0,0.07);
  color: var(--warn);
}
.lb-cell.value.note {
  background: rgba(150,150,150,0.06);
  color: var(--text3);
  font-style: italic;
  white-space: normal;
  text-align: left;
}

</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-eyebrow">JoongAng BizSolutions</span>
    <h1>2026 OOH 재원 현황</h1>
  </div>
  <span class="week-badge">로딩 중...</span>
</header>

<div class="month-tabs" id="monthTabs"></div>

<div class="section-block">
  <div class="section-header">
    <span class="section-num">01</span>
    <h2 class="section-title-large">OOH</h2>
    <span class="section-desc">매체별 부킹 현황 — 클릭하면 광고주 리스트를 볼 수 있어요</span>
  </div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="section-block">
  <div class="section-header">
    <span class="section-num">02</span>
    <h2 class="section-title-large">라이트박스 &amp; 아트월</h2>
    <span class="section-desc">매체별 월간 운영 현황</span>
  </div>
  <div id="lightboxSection"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- Slide Panel -->
<div class="slide-panel" id="slidePanel">
  <div class="panel-header">
    <div class="panel-title-wrap">
      <span class="panel-eyebrow" id="panelEyebrow">광고주 현황</span>
      <span class="panel-title" id="panelTitle">-</span>
    </div>
    <button class="panel-close" onclick="closePanel()">&#x2715;</button>
  </div>
  <div class="panel-month-tabs" id="panelMonthTabs"></div>
  <div class="panel-summary" id="panelSummary"></div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>

/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbywK5-EdcgUj145iceL_oasHiFkLZR1GczJYnk_XkEBYVX4Qbyxias1-FQIdG-OvxoGcQ/exec";

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let SUMMARY = {};
let ADVERTISERS = {};
let MONTHS = [];
let activeMonth = "";
let panelMedia = null;
let panelMonth = "";
const chartInstances = {};

/* ═══════════════════════════════════════════
   FETCH DATA
═══════════════════════════════════════════ */
function showLoading() {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)">
      <div class="spinner"></div>
      <p style="margin-top:1rem;font-size:13px">시트에서 데이터를 불러오는 중...</p>
    </div>`;
}

function showError(msg) {
  document.getElementById('cardGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--danger)">
      <p style="font-size:13px">⚠ 데이터를 불러오지 못했어요</p>
      <p style="font-size:11px;margin-top:6px;color:var(--text3)">${msg}</p>
    </div>`;
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch(GAS_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    SUMMARY     = json.summary     || {};
    ADVERTISERS = json.advertisers || {};
    MONTHS      = Object.keys(SUMMARY);
    // 현재 월을 기본 활성으로 (없으면 첫 월)
    const now = new Date();
    const curKey = `26년 ${now.getMonth() + 1}월`;
    activeMonth = MONTHS.includes(curKey) ? curKey : (MONTHS[0] || "");
    panelMonth  = activeMonth;

    // 상단 기준 라벨: 오늘 날짜 기준
    const badge = document.querySelector('.week-badge');
    const today = new Date();
    badge.textContent = `${today.getMonth() + 1}월 ${today.getDate()}일 기준`;

    render();
  } catch (e) {
    showError(e.message);
    console.error(e);
  }
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
// 시점(monthsAhead: 0=이번달, 1=다음달, 2=다다음달...) + 부킹률 → 5단계 상태
// 매체를 파는 입장: 잔여가 많으면 → 나쁨. 시점이 가까울수록 더 가혹하게.
function getStatus(pct, monthsAhead) {
  if (pct === null || pct === undefined) return 'neutral';
  // 임박/마감은 시점 무관하게 양호
  if (pct >= 95) return 'excellent';   // 매우 양호 (마감 임박~마감)
  if (pct >= 75) return 'good';        // 양호

  // 시점별 차등 기준
  if (monthsAhead === 0) {
    // 이번 달: 가혹하게
    if (pct >= 50) return 'normal';
    if (pct >= 30) return 'bad';
    return 'critical';                  // 매우 나쁨
  } else if (monthsAhead === 1) {
    // 다음 달
    if (pct >= 40) return 'normal';
    if (pct >= 20) return 'bad';
    return 'critical';
  } else {
    // 2달 이후
    if (pct >= 25) return 'normal';
    if (pct >= 10) return 'bad';
    return 'critical';
  }
}

// 현재 활성 월과 데이터 월의 차이 계산
// activeMonth: "26년 4월", currentMonth: "26년 4월" 형태
function getMonthsAhead(targetMonth) {
  // 현재 시스템 시간 기준
  const now = new Date();
  const curYr = now.getFullYear() % 100;
  const curMo = now.getMonth() + 1;

  const m = targetMonth.match(/(\d{2})년\s*(\d{1,2})월/);
  if (!m) return 0;
  const tYr = parseInt(m[1]);
  const tMo = parseInt(m[2]);

  return (tYr - curYr) * 12 + (tMo - curMo);
}
function getColors(pct) {
  // 유가: 파랑 계열 (좋은 것), 서비스: 주황 계열 (중립/경고), 잔여: 회색
  return { paid:'#3a6af8', svc:'#f0a500', remain:'#e4e7ef' };
}

/* ═══════════════════════════════════════════
   RENDER — Main Dashboard
═══════════════════════════════════════════ */
function renderMonthTabs() {
  const tabsEl = document.getElementById('monthTabs');
  tabsEl.innerHTML = MONTHS.map(m =>
    `<button class="month-tab${m===activeMonth?' active':''}" onclick="setMonth('${m}')">${m.replace(/^\d{2}년\s*/, '')}</button>`
  ).join('');
  // 활성 탭이 화면에 보이도록 스크롤
  requestAnimationFrame(() => {
    const active = tabsEl.querySelector('.month-tab.active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'auto', block: 'nearest' });
  });
}




function destroyCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  for (const k in chartInstances) delete chartInstances[k];
}

function renderCards(data) {
  destroyCharts();

  // ── 카드용: 월 15일 이상 운영 광고만 포함한 paid/svc 재계산 ──
  const cardMonthMatch = activeMonth.match(/(\d{1,2})월/);
  const cardTargetMonth = cardMonthMatch ? parseInt(cardMonthMatch[1]) : (new Date().getMonth() + 1);
  const cardTargetYear  = 2026;
  const cardMonthDays   = new Date(cardTargetYear, cardTargetMonth, 0).getDate();

  function cardActiveDays(periodStr) {
    if (!periodStr || !String(periodStr).trim()) return cardMonthDays;
    const segments = String(periodStr).split(/,/).map(s => s.trim()).filter(Boolean);
    let total = 0;
    let anyValidFormat = false;
    segments.forEach(seg => {
      const monthRange = seg.match(/^(\d{1,2})\s*~\s*(\d{1,2})\s*월?$/);
      if (monthRange) {
        anyValidFormat = true;
        const sm = parseInt(monthRange[1]);
        const em = parseInt(monthRange[2]);
        if (cardTargetMonth >= sm && cardTargetMonth <= em) total += cardMonthDays;
        return;
      }
      const parts = seg.split(/~/);
      if (parts.length !== 2) return;
      const parseDate = (str) => {
        const m = str.trim().match(/^(?:(\d{2,4})\/)?(\d{1,2})\/(\d{1,2})$/);
        if (!m) return null;
        let y = m[1] ? parseInt(m[1]) : cardTargetYear;
        if (y < 100) y += 2000;
        return new Date(y, parseInt(m[2]) - 1, parseInt(m[3]));
      };
      const s = parseDate(parts[0]);
      const e = parseDate(parts[1]);
      if (!s || !e) return;
      anyValidFormat = true;
      const monthStart = new Date(cardTargetYear, cardTargetMonth - 1, 1);
      const monthEnd   = new Date(cardTargetYear, cardTargetMonth, 0);
      if (e < monthStart || s > monthEnd) return;
      const segStart = s >= monthStart ? s : monthStart;
      const segEnd   = e <= monthEnd   ? e : monthEnd;
      total += Math.floor((segEnd - segStart) / 86400000) + 1;
    });
    if (!anyValidFormat) return cardMonthDays;
    return total;
  }

  function recalcPaidSvc(mediaName, comTotal) {
    const advData = ADVERTISERS && ADVERTISERS[mediaName] && ADVERTISERS[mediaName][activeMonth];
    const list = (advData && advData.list) || [];
    if (!list.length) return null;
    const filtered = list.filter(a => cardActiveDays(a.period) >= 15);
    const paid = filtered
      .filter(a => a.type === '일반' || a.type === '패키지' || a.type === '협찬' || a.type === '바터')
      .reduce((s, a) => s + (Number(a.slot) || 0), 0);
    const svc = filtered
      .filter(a => a.type === '서비스' || a.type === '타운보드(서비스)')
      .reduce((s, a) => s + (Number(a.slot) || 0), 0);
    // 확정부킹 = 유가 + 서비스 (15일 이상 필터 적용), 잔여 = 총재원 - 확정부킹
    const booked = paid + svc;
    const remain = comTotal != null ? Math.max(0, comTotal - booked) : null;
    return {
      paid:   Math.round(paid * 10) / 10,
      svc:    Math.round(svc * 10) / 10,
      booked: Math.round(booked * 10) / 10,
      remain: remain != null ? Math.round(remain * 10) / 10 : null,
    };
  }

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = data.map((d, i) => {
    // 일반 매체만 paid/svc 재계산 (경기버스/KT스퀘어 제외)
    const isBus_ = d.name === '경기버스' || d.kind === 'bus';
    const isKt_  = d.name === 'KT Square';
    if (!isBus_ && !isKt_) {
      const recalc = recalcPaidSvc(d.name, d.comTotal);
      if (recalc) {
        d.paid   = recalc.paid;
        d.svc    = recalc.svc;
        d.booked = recalc.booked;
        if (recalc.remain != null) d.remain = recalc.remain;
        // bookPct도 재계산 (확정부킹 ÷ 총재원)
        if (d.comTotal) {
          d.bookPct = Math.round((recalc.booked / d.comTotal) * 1000) / 10;
        }
      }
    }
    const col = getColors(d.bookPct);
    const isBus       = d.name === '경기버스' || d.kind === 'bus';
    const unit  = isBus ? '대' : '구좌';

    // 도넛 중앙 표시값
    const isKtSquare = d.name === 'KT Square';
    let centerPct, centerLabel, totalPctDisp = '';
    let paidPctDisp;
    if (isKtSquare) {
      // KT 스퀘어: 부킹률 무의미 → 확정부킹 건수만 표시
      centerLabel = '확정부킹';
      paidPctDisp = d.booked != null ? (Math.round(d.booked * 10) / 10) + '건' : '-';
      centerPct = null;
    } else if (isBus) {
      centerPct = d.bookPct;
      centerLabel = '집행률';
      paidPctDisp = centerPct !== null && centerPct !== undefined ? centerPct.toFixed(1) + '%' : '-';
    } else {
      // 일반 매체: 부킹률 (확정부킹 ÷ 총재원)
      centerPct = d.bookPct;
      centerLabel = '부킹률';
      paidPctDisp = centerPct !== null && centerPct !== undefined ? centerPct.toFixed(1) + '%' : '-';
    }

    // 카드 상태는 전체 부킹률 기준
    const st = isKtSquare ? 'neutral' : getStatus(d.bookPct, getMonthsAhead(activeMonth));
    const remainDisp = d.remain !== null && d.remain !== undefined ? (Math.round(d.remain*10)/10) + unit : '-';
    const badgeMap = {
      excellent:['badge-excellent','매우 양호'],
      good:     ['badge-good','양호'],
      normal:   ['badge-normal','보통'],
      bad:      ['badge-bad','나쁨'],
      critical: ['badge-critical','매우 나쁨'],
      neutral:  ['','']
    };
    const [badgeCls, badgeTxt] = badgeMap[st];

    return `
      <div class="media-card status-${st}" onclick="openPanel('${d.name}')">
        ${badgeTxt ? `<span class="status-badge ${badgeCls}">${badgeTxt}</span>` : ''}
        <div class="media-name">${d.name}</div>
        <div class="donut-wrap">
          <canvas id="chart_${i}" width="120" height="120"></canvas>
          <div class="donut-center">
            <div class="donut-pct">${paidPctDisp}</div>
            <div class="donut-label">${centerLabel}</div>
            ${totalPctDisp ? `<div class="donut-total">${totalPctDisp}</div>` : ''}
          </div>
        </div>
        <div class="legend">
          ${isBus ? `
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">총 재원</span></span>
              <span class="legend-val">${d.comTotal != null ? Math.round(d.comTotal) : 0}대</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">집행</span></span>
              <span class="legend-val">${d.booked != null ? Math.round(d.booked) : 0}대</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">잔여</span></span>
              <span class="legend-val">${remainDisp}</span>
            </div>
          ` : `
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.paid}"></span><span class="legend-key">총 재원</span></span>
              <span class="legend-val">${d.comTotal != null ? Math.round(d.comTotal*10)/10 : '-'}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.svc}"></span><span class="legend-key">확정부킹</span></span>
              <span class="legend-val">${d.booked != null ? Math.round(d.booked*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item sub">
              <span class="legend-left"><span class="legend-sub-dot"></span><span class="legend-key sub">└ 유가</span></span>
              <span class="legend-val sub">${d.paid != null ? Math.round(d.paid*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item sub">
              <span class="legend-left"><span class="legend-sub-dot"></span><span class="legend-key sub">└ 서비스</span></span>
              <span class="legend-val sub">${d.svc != null ? Math.round(d.svc*10)/10 : 0}구좌</span>
            </div>
            <div class="legend-item">
              <span class="legend-left"><span class="legend-dot" style="background:${col.remain};border:1px solid #d0d4de"></span><span class="legend-key">잔여</span></span>
              <span class="legend-val">${remainDisp}</span>
            </div>
          `}
        </div>
        <span class="click-hint">광고주 보기 →</span>
      </div>
    `;
  }).join('');

  requestAnimationFrame(() => {
    data.forEach((d, i) => {
      const canvas = document.getElementById(`chart_${i}`);
      if (!canvas) return;
      const col      = getColors(d.bookPct);
      const remainVal = d.remain != null ? d.remain : 0;
      const isBus = d.name === '경기버스' || d.kind === 'bus';
      // 차트 데이터: [확정부킹/집행, 0, 잔여]
      const vals = [(d.booked || 0), 0, remainVal];
      chartInstances[`chart_${i}`] = new Chart(canvas, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: vals,
            backgroundColor: [col.paid, col.svc, col.remain],
            borderWidth: 0, hoverOffset: 5
          }]
        },
        options: {
          responsive: false, cutout: '70%',
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => {
              const labels = isBus ? ['집행', '', '잔여'] : ['확정부킹', '', '잔여'];
              const u = isBus ? '대' : '구좌';
              return ` ${labels[ctx.dataIndex]}: ${ctx.parsed}${u}`;
            }}}
          },
          animation: { duration: 600, easing: 'easeOutQuart' }
        }
      });
    });
  });
}

/* ═══════════════════════════════════════════
   RENDER — Slide Panel
═══════════════════════════════════════════ */
function renderPanel() {
  if (!panelMedia) return;
  const mediaData = ADVERTISERS[panelMedia];

  document.getElementById('panelEyebrow').textContent = '광고주 현황';
  document.getElementById('panelTitle').textContent   = panelMedia;

  document.getElementById('panelMonthTabs').innerHTML = MONTHS.map(m =>
    `<button class="panel-tab${m===panelMonth?' active':''}" onclick="setPanelMonth('${m}')">${m}</button>`
  ).join('');

  const mData = mediaData && mediaData[panelMonth]
    ? mediaData[panelMonth]
    : { total:null, booked:0, remain:null, list:[] };

  const isBus = panelMedia === '경기버스';
  const list = mData.list || [];

  if (isBus) {
    // 경기버스: 총재원/집행/잔여 (대 단위)
    const pct = mData.bookPct;
    const pctCls = pct == null ? '' : pct >= 70 ? 'ok' : pct >= 40 ? 'warn' : 'danger';
    document.getElementById('panelSummary').innerHTML = `
      <div class="p-chip">
        <div class="p-chip-label">집행률</div>
        <div class="p-chip-val ${pctCls}">${pct !== null && pct !== undefined ? Number(pct).toFixed(1)+'%' : '-'}</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">총 재원</div>
        <div class="p-chip-val">${mData.comTotal != null ? Math.round(mData.comTotal) : (mData.total != null ? Math.round(mData.total) : '-')}대</div>
      </div>
      <div class="p-chip">
        <div class="p-chip-label">잔여 평균</div>
        <div class="p-chip-val">${mData.remain != null ? Math.round(mData.remain) : '-'}대</div>
      </div>
    `;
  } else if (panelMedia === 'KT Square') {
    // KT 스퀘어: 부킹률 의미 없음 → 확정부킹/잔여 건수만
    const list_kt = mData.list || [];
    const totalBooked = list_kt.reduce((s, a) => s + (Number(a.slot) || 0), 0);
    const fmt = v => v != null ? Number(v).toFixed(1).replace(/\.0$/, '') : '-';
    document.getElementById('panelSummary').innerHTML = `
      <div class="panel-bar-wrap">
        <div class="panel-bar-header">
          <div class="panel-bar-pct">
            <span class="panel-bar-pct-label">확정부킹</span>
            <span class="panel-bar-pct-val ok">${fmt(totalBooked || mData.booked)}<span style="font-size:13px;font-weight:500;margin-left:4px">건</span></span>
          </div>
          <div class="panel-bar-total">
            <strong>잔여 ${fmt(mData.remain)}</strong>구좌
          </div>
        </div>
      </div>
    `;
  } else {
    // ── 헤더 계산용: 해당 월 15일 이상 운영 광고만 포함 ──
    const monthMatch = panelMonth.match(/(\d{1,2})월/);
    const hdrTargetMonth = monthMatch ? parseInt(monthMatch[1]) : (new Date().getMonth() + 1);
    const hdrTargetYear  = 2026;
    const hdrMonthDays   = new Date(hdrTargetYear, hdrTargetMonth, 0).getDate();

    // 해당 월에 광고가 며칠 운영되는지 계산
    function activeDaysInMonth(periodStr) {
      if (!periodStr || !String(periodStr).trim()) return hdrMonthDays; // 빈 period = 월 전체
      const segments = String(periodStr).split(/,/).map(s => s.trim()).filter(Boolean);
      let total = 0;
      let anyValidFormat = false;

      segments.forEach(seg => {
        // "3~6월" 같은 월 단위
        const monthRange = seg.match(/^(\d{1,2})\s*~\s*(\d{1,2})\s*월?$/);
        if (monthRange) {
          anyValidFormat = true;
          const sm = parseInt(monthRange[1]);
          const em = parseInt(monthRange[2]);
          if (hdrTargetMonth >= sm && hdrTargetMonth <= em) total += hdrMonthDays;
          return;
        }
        const parts = seg.split(/~/);
        if (parts.length !== 2) return;
        const parseDate = (str) => {
          const m = str.trim().match(/^(?:(\d{2,4})\/)?(\d{1,2})\/(\d{1,2})$/);
          if (!m) return null;
          let y = m[1] ? parseInt(m[1]) : hdrTargetYear;
          if (y < 100) y += 2000;
          return new Date(y, parseInt(m[2]) - 1, parseInt(m[3]));
        };
        const s = parseDate(parts[0]);
        const e = parseDate(parts[1]);
        if (!s || !e) return;
        anyValidFormat = true;
        const monthStart = new Date(hdrTargetYear, hdrTargetMonth - 1, 1);
        const monthEnd   = new Date(hdrTargetYear, hdrTargetMonth, 0);
        if (e < monthStart || s > monthEnd) return;
        const segStart = s >= monthStart ? s : monthStart;
        const segEnd   = e <= monthEnd   ? e : monthEnd;
        total += Math.floor((segEnd - segStart) / 86400000) + 1;
      });
      // 어떤 형식도 인식 못한 경우 (예: "매시 0~24분") → 월 전체로 fallback
      if (!anyValidFormat) return hdrMonthDays;
      return total;
    }

    // 광고주 리스트 기반 일반/서비스 구좌수 계산 (월 15일 이상 운영만)
    const paidSlot = list
      .filter(a => a.type === '일반' || a.type === '패키지' || a.type === '협찬' || a.type === '바터')
      .filter(a => activeDaysInMonth(a.period) >= 15)
      .reduce((s, a) => s + (Number(a.slot) || 0), 0);
    const svcSlot = list
      .filter(a => a.type === '서비스' || a.type === '타운보드(서비스)')
      .filter(a => activeDaysInMonth(a.period) >= 15)
      .reduce((s, a) => s + (Number(a.slot) || 0), 0);
    // fallback - 리스트가 없을 때 mData 사용
    const paid = list.length ? paidSlot : (mData.paid || 0);
    const svc  = list.length ? svcSlot  : (mData.svc  || 0);

    const comTotal = mData.comTotal || 0;
    const booked = paid + svc;
    const remain = Math.max(0, comTotal - booked);

    const bookedPctNum = comTotal ? (booked / comTotal * 100) : 0;
    const bookedPct = comTotal ? bookedPctNum.toFixed(1) : null;
    const pctCls    = bookedPct === null ? '' : bookedPctNum >= 70 ? 'ok' : bookedPctNum >= 40 ? 'warn' : 'danger';
    const fmt = v => v != null ? Number(v).toFixed(1).replace(/\.0$/, '') : '-';

    // 막대 폭 (총재원 기준 %)
    const paidW   = comTotal ? Math.max(0, Math.min(100, paid / comTotal * 100)) : 0;
    const svcW    = comTotal ? Math.max(0, Math.min(100, svc / comTotal * 100)) : 0;
    const remainW = Math.max(0, 100 - paidW - svcW);

    document.getElementById('panelSummary').innerHTML = `
      <div class="panel-bar-wrap">
        <div class="panel-bar-header">
          <div class="panel-bar-pct">
            <span class="panel-bar-pct-label">부킹률</span>
            <span class="panel-bar-pct-val ${pctCls}">${bookedPct !== null ? bookedPct + '%' : '-'}</span>
          </div>
          <div class="panel-bar-total">
            <strong>총 ${fmt(comTotal)}</strong>구좌
            <span style="margin-left:8px;color:var(--text3);font-size:11px">· 일반 ${fmt(paid)} · 서비스 ${fmt(svc)} · 잔여 ${fmt(remain)}</span>
          </div>
        </div>
        <div class="panel-bar">
          <div class="panel-bar-fill" style="width:${paidW}%" title="일반 ${fmt(paid)}구좌">
            <span class="panel-bar-val-text">${paidW >= 10 ? fmt(paid) + '구좌' : ''}</span>
          </div>
          <div class="panel-bar-service" style="width:${svcW}%" title="서비스 ${fmt(svc)}구좌">
            <span class="panel-bar-val-text">${svcW >= 10 ? fmt(svc) + '구좌' : ''}</span>
          </div>
          <div class="panel-bar-remain" style="width:${remainW}%" title="잔여 ${fmt(remain)}구좌">
            <span class="panel-bar-val-text">${remainW >= 10 ? fmt(remain) + '구좌' : ''}</span>
          </div>
        </div>
      </div>
    `;
  }

  const body     = document.getElementById('panelBody');

  if (list.length === 0) {
    body.innerHTML = `<div class="empty-state">등록된 광고주가 없습니다</div>`;
    return;
  }

  // panelMonth에서 년/월 추출
  const monthMatch = panelMonth.match(/(\d{1,2})월/);
  const targetMonth = monthMatch ? parseInt(monthMatch[1]) : (new Date().getMonth() + 1);
  const targetYear = 2026;

  // 해당 월의 일수
  const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
  const today = new Date();
  const isCurrentMonth = (today.getFullYear() === targetYear && today.getMonth() + 1 === targetMonth);
  const todayDate = today.getDate();

  // period 문자열을 { startDay, endDay } 배열로 파싱 (여러 구간 가능)
  // 지원 포맷:
  //   "4/7~4/21"        — 같은 해, M/D 기준
  //   "3/1~5/31"        — 여러 달
  //   "25/12/16~26/1/15" — YY/M/D
  //   "26/05/01~27/04/30" — YYYY 4자리
  //   "4/22~4/23, 4/27~5/26" — 쉼표로 구분된 여러 구간
  //   "3~6월"           — 월 단위
  //   "1~12월" / "1~12"  — 월 단위
  function parsePeriod(periodStr, year, mo) {
    const fullMonth = () => [{ start: 1, end: new Date(year, mo, 0).getDate() }];

    // period가 비어있으면 해당 월 전체 (1일~말일) 채움
    if (!periodStr || !String(periodStr).trim()) {
      return fullMonth();
    }
    const segments = String(periodStr).split(/,/).map(s => s.trim()).filter(Boolean);
    const ranges = [];
    let anyValidFormat = false;  // 알려진 형식이 하나라도 인식됐는지

    segments.forEach(seg => {
      // "3~6월" 같은 월 단위
      const monthRange = seg.match(/^(\d{1,2})\s*~\s*(\d{1,2})\s*월?$/);
      if (monthRange) {
        anyValidFormat = true;
        const sm = parseInt(monthRange[1]);
        const em = parseInt(monthRange[2]);
        if (mo >= sm && mo <= em) {
          ranges.push({ start: 1, end: new Date(year, mo, 0).getDate() });
        }
        return;
      }

      // 일반 날짜 범위
      // 시작/종료 분리
      const parts = seg.split(/~/);
      if (parts.length !== 2) return;
      const startStr = parts[0].trim();
      const endStr   = parts[1].trim();

      const parseDate = (str) => {
        // "25/12/16", "26/1/15", "26/05/01", "12/29", "4/7" 등
        const m = str.match(/^(?:(\d{2,4})\/)?(\d{1,2})\/(\d{1,2})$/);
        if (!m) return null;
        let y = m[1] ? parseInt(m[1]) : year;
        if (y < 100) y += 2000;
        return { y: y, m: parseInt(m[2]), d: parseInt(m[3]) };
      };

      const s = parseDate(startStr);
      const e = parseDate(endStr);
      if (!s || !e) return;

      anyValidFormat = true;  // 날짜 형식 인식됨

      // 해당 월(year-mo)과 겹치는 구간 계산
      const monthStart = new Date(year, mo - 1, 1);
      const monthEnd   = new Date(year, mo, 0);
      const segStart   = new Date(s.y, s.m - 1, s.d);
      const segEnd     = new Date(e.y, e.m - 1, e.d);

      if (segEnd < monthStart || segStart > monthEnd) return; // 안 겹침

      const startDay = segStart >= monthStart ? s.d : 1;
      const endDay   = segEnd   <= monthEnd   ? e.d : monthEnd.getDate();
      if (startDay <= endDay) {
        ranges.push({ start: startDay, end: endDay, segStart: segStart, segEnd: segEnd, monthStart, monthEnd });
      }
    });

    // 어떤 형식도 인식 못한 경우 → 월 전체로 fallback (예: "매시 0~24분")
    if (!anyValidFormat) return fullMonth();
    return ranges;
  }

  // 요일 계산 (0=일, 6=토)
  function dayOfWeek(year, month, day) {
    return new Date(year, month - 1, day).getDay();
  }

  // 구좌수 → 바 높이 비율 (0.3 + slot * 0.4, 최대 0.95, 최소 0.25)
  // 0.5구좌 → 50% / 1구좌 → 70% / 1.5구좌 → 90% / 2구좌+ → 95%
  function slotToHeightRatio(slot) {
    const s = Number(slot) || 0;
    if (s <= 0) return 0.3;
    return Math.min(0.95, Math.max(0.25, 0.3 + s * 0.4));
  }

  // 구좌수 뱃지 클래스 (시각적 강조)
  function slotBadgeClass(slot, typeClass) {
    const s = Number(slot) || 0;
    if (typeClass === 'type-service') return 'svc';
    if (s < 1) return 'half';
    if (s >= 2) return 'large';
    return '';
  }

  // 구좌수 표시 포맷 (정수면 정수로, 소수면 소수로)
  function formatSlot(slot) {
    const s = Number(slot) || 0;
    if (s === 0) return '-';
    // 소수점 1자리로 반올림 (예: 2.175 → 2.2, 0.725 → 0.7)
    return Number.isInteger(s) ? String(s) : (Math.round(s * 10) / 10).toFixed(1).replace(/\.0$/, '');
  }

  // 편성표 한 줄 렌더링
  function renderScheduleRow(a, typeClass) {
    const ranges = parsePeriod(a.period, targetYear, targetMonth);
    const heightRatio = slotToHeightRatio(a.slot);
    const verticalPad = (1 - heightRatio) / 2 * 100;  // %
    const barStyle = `top:${verticalPad.toFixed(1)}%;bottom:${verticalPad.toFixed(1)}%`;

    const dayCells = [];
    for (let d = 1; d <= 31; d++) {
      if (d > daysInMonth) {
        dayCells.push('<div class="sch-day" style="background:var(--bg3);opacity:0.4"></div>');
        continue;
      }
      const dow = dayOfWeek(targetYear, targetMonth, d);
      const isToday = isCurrentMonth && d === todayDate;
      const cls = ['sch-day'];
      if (dow === 0 || dow === 6) cls.push('weekend');
      if (isToday) cls.push('today');

      let bar = '';
      ranges.forEach(r => {
        if (d >= r.start && d <= r.end) {
          const barCls = ['sch-bar', typeClass];
          if (d === r.start) barCls.push('start');
          if (d === r.end)   barCls.push('end');
          bar = `<div class="${barCls.join(' ')}" style="${barStyle}"></div>`;
        }
      });
      dayCells.push(`<div class="${cls.join(' ')}">${bar}</div>`);
    }

    const slotDisp = formatSlot(a.slot);
    const badgeCls = slotBadgeClass(a.slot, typeClass);
    const nameTitle = `${a.name}${a.period ? ' · ' + a.period : ''}${a.slot ? ' · ' + a.slot + '구좌' : ''}`;

    // runtime 표시 (15/20/30/60초)
    const rt = Number(a.runtime) || 0;
    const rtClass = rt >= 60 ? 'rt-60' : rt >= 30 ? 'rt-30' : rt >= 20 ? 'rt-20' : 'rt-15';
    const rtBadge = rt > 0 ? `<span class="rt-badge ${rtClass}">${rt}"</span>` : '';

    return `
      <div class="sch-cell name ${typeClass}-type" title="${nameTitle.replace(/"/g, '&quot;')}">
        <div class="sch-name-wrap">
          <span class="sch-name-text">${a.name}</span>
          ${rtBadge}
          <span class="slot-badge ${badgeCls}">${slotDisp}</span>
        </div>
      </div>
      ${dayCells.join('')}
    `;
  }

  // 헤더 (1~31일)
  function renderScheduleHeader() {
    const headerCells = ['<div class="sch-cell day-header first">광고주</div>'];
    for (let d = 1; d <= 31; d++) {
      let cls = 'sch-cell day-header';
      if (d <= daysInMonth) {
        const dow = dayOfWeek(targetYear, targetMonth, d);
        if (dow === 0) cls += ' weekend';
        else if (dow === 6) cls += ' saturday';
      } else {
        cls += '" style="opacity:0.3';
      }
      headerCells.push(`<div class="${cls}">${d}</div>`);
    }
    return headerCells.join('');
  }

  function renderScheduleSection(title, items, typeClass) {
    if (!items.length) return '';
    return `
      <div class="schedule-wrap">
        <div class="sch-section-title">
          <span class="type-badge type-${typeClass === 'type-normal' ? 'normal' : 'service'}">${title.split(' ')[0]}</span>
          ${title} (${items.length}건)
        </div>
        <div class="schedule-scroll">
          <div class="schedule-table">
            ${renderScheduleHeader()}
            ${items.map(a => renderScheduleRow(a, typeClass)).join('')}
          </div>
        </div>
      </div>
    `;
  }

  // ── 경기버스: 편성표 형태 (중앙 → 나래, 대수 내림차순) ──
  if (isBus) {
    const qtyDesc = (a, b) => (Number(b.qty) || 0) - (Number(a.qty) || 0);
    const centralAdvs = list
      .filter(a => a.type === '중앙')
      .sort(qtyDesc)
      .map(a => ({ ...a, slot: a.qty }));
    const naraeAdvs = list
      .filter(a => a.type === '나래')
      .sort(qtyDesc)
      .map(a => ({ ...a, slot: a.qty }));

    body.innerHTML = `
      ${renderScheduleSection('중앙 광고주', centralAdvs, 'type-service')}
      ${renderScheduleSection('나래 광고주', naraeAdvs, 'type-normal')}
      ${(!centralAdvs.length && !naraeAdvs.length) ? '<div class="sch-empty">' + panelMonth + '에 운영 중인 광고주가 없습니다</div>' : ''}
    `;
    return;
  }

  // ── 일반 OOH 매체: 유가/서비스 광고주 편성표 ──
  // 정렬: 다구좌(큰 값) → 1구좌 → 0.5구좌 (slot 내림차순)
  const slotDesc = (a, b) => (Number(b.slot) || 0) - (Number(a.slot) || 0);
  const paidAdvs = list
    .filter(a => a.type === '일반' || a.type === '패키지' || a.type === '협찬' || a.type === '바터')
    .sort(slotDesc);
  const svcAdvs  = list
    .filter(a => a.type === '서비스' || a.type === '타운보드(서비스)')
    .sort(slotDesc);

  body.innerHTML = `
    ${renderScheduleSection('유가 광고주', paidAdvs, 'type-normal')}
    ${renderScheduleSection('서비스 광고주', svcAdvs, 'type-service')}
    ${(!paidAdvs.length && !svcAdvs.length) ? '<div class="sch-empty">' + panelMonth + '에 운영 중인 광고주가 없습니다</div>' : ''}
  `;
}

function openPanel(mediaName) {
  panelMedia = mediaName;
  panelMonth = activeMonth;
  renderPanel();
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function setPanelMonth(m) {
  panelMonth = m;
  renderPanel();
}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
function render() {
  if (!activeMonth || !SUMMARY[activeMonth]) return;
  const data = SUMMARY[activeMonth];
  renderMonthTabs();
  renderCards(data);
  renderLightboxSection();
}

function renderLightboxSection() {
  const container = document.getElementById('lightboxSection');
  if (!container) return;
  const lb = (ADVERTISERS && ADVERTISERS.__lightbox) || { rows: [] };
  const rows = lb.rows || [];

  if (!rows.length) {
    container.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px">라이트박스 / 아트월 데이터가 없습니다</div>';
    return;
  }

  // 월 헤더
  const monthHeaders = [];
  for (let m = 1; m <= 12; m++) monthHeaders.push(`<div class="lb-cell header">${m}월</div>`);

  // 데이터 행
  const dataRows = rows.map(r => {
    const cells = [
      `<div class="lb-cell category">${r.category || ''}</div>`,
      `<div class="lb-cell media">${r.media || ''}</div>`,
    ];

    // 첫 월에 긴 메모(여러 셀에 걸친 공지)가 있는지 확인
    // 메모 패턴: 첫 월 셀에 긴 텍스트가 있고 다른 월에는 거의 없는 경우
    const monthValues = [];
    for (let m = 1; m <= 12; m++) {
      const v = (r.months && r.months[m + '월']) || '';
      monthValues.push(v);
    }
    // 첫 셀에 긴 메모만 있는 경우 → 12개월 통합 표시
    const firstVal = monthValues[0];
    const hasOnlyFirst = firstVal && monthValues.slice(1).every(v => !v);
    const isNote = hasOnlyFirst && firstVal.length > 15;

    if (isNote) {
      // 1개 셀로 12개월 합쳐서 표시
      cells.push(`<div class="lb-cell value note" style="grid-column: span 12; white-space: normal; text-align: left">${firstVal}</div>`);
    } else {
      monthValues.forEach((v, idx) => {
        if (!v) {
          cells.push(`<div class="lb-cell value"></div>`);
          return;
        }
        // 상태 분류
        let cls = 'value has-ad';
        if (v.includes('완료') || v.includes('부킹 완료')) cls = 'value completed';
        else if (v.includes('가부킹') || v.includes('협의')) cls = 'value tentative';
        cells.push(`<div class="lb-cell ${cls}" title="${v.replace(/"/g, '&quot;')}">${v}</div>`);
      });
    }
    return cells.join('');
  }).join('');

  container.innerHTML = `
    <div class="lb-wrap">
      <div class="lb-scroll">
        <div class="lb-table">
          <div class="lb-cell header">구분</div>
          <div class="lb-cell header" style="text-align:left">매체</div>
          ${monthHeaders.join('')}
          ${dataRows}
        </div>
      </div>
    </div>
  `;
}
